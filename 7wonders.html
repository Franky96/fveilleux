<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Wonders — Score</title>
  <link rel="stylesheet" href="style.css">
  <script>
    const _p7 = JSON.parse(sessionStorage.getItem('userPermissions') || '[]');
    if (!sessionStorage.getItem('loggedIn') ||
        (!_p7.includes('jeuxdesociete') && sessionStorage.getItem('userRole') !== 'admin')) {
      window.location.href = 'dashboard.html';
    }
  </script>
  <style>
    body { align-items: flex-start; }
    .w7 { width: 100%; max-width: 100%; padding-bottom: 2rem; }

    /* ── Topbar ── */
    .w7-topbar {
      position: sticky; top: 0; z-index: 100;
      background: #0f1a0f; border-bottom: 1px solid #2a3a2a;
      padding: 0.6rem 1rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .w7-topbar a { color: #80cc80; text-decoration: none; font-size: 1.3rem; }
    .w7-topbar h1 { font-size: 1rem; color: #f0ede6; margin: 0; flex: 1; }

    /* ── Setup ── */
    .w7-setup { padding: 1.25rem; max-width: 500px; margin: 0 auto; }
    .setup-lbl { font-size: 0.72rem; color: #556655; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .nb-btns { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .nb-btn {
      width: 2.6rem; height: 2.6rem; border-radius: 50%;
      border: 2px solid #2a3a2a; background: transparent;
      color: #556655; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.15s;
    }
    .nb-btn.active { border-color: #c9a84c; color: #c9a84c; background: rgba(201,168,76,0.1); }
    .name-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
    .name-num {
      width: 1.7rem; height: 1.7rem; border-radius: 50%; flex-shrink: 0;
      font-size: 0.75rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-start {
      display: block; width: 100%; margin-top: 1.25rem;
      padding: 0.9rem; background: #c9a84c; color: #0a0f0a;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer;
    }

    /* ── Bandeau noms joueurs (sticky viewport, hors overflow) ── */
    #player-header {
      position: sticky;
      top: 0; /* mis à jour par JS */
      z-index: 50;
      background: #0f1a0f;
      border-bottom: 2px solid #2a3a2a;
      display: flex;
      overflow-x: hidden; /* scroll synchronisé par JS */
    }
    .ph-cell {
      min-width: 105px; flex-shrink: 0;
      padding: 0.6rem 0.75rem;
      font-size: 0.82rem; font-weight: bold;
      text-align: center; white-space: nowrap;
    }
    .ph-corner {
      min-width: 145px; max-width: 145px; flex-shrink: 0;
      text-align: left;
      position: sticky; left: 0; z-index: 5;
      background: #0f1a0f;
      border-right: 1px solid #2a3a2a;
      padding: 0.6rem 0.85rem;
    }

    /* ── Score table ── */
    .score-outer {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .score-table {
      border-collapse: collapse;
      width: 100%;
      min-width: 320px;
    }

    /* thead invisible — garde les largeurs de colonnes */
    .score-table thead th {
      visibility: hidden;
      padding: 0; height: 0; line-height: 0;
      border: none; font-size: 0;
    }
    /* Sticky first column */
    .score-table .cat-col {
      position: sticky; left: 0; z-index: 5;
      background: #0a0f0a;
      padding: 0.55rem 0.85rem;
      border-right: 1px solid #2a3a2a;
      min-width: 145px; max-width: 145px;
      text-align: left;
    }

    .score-table td {
      padding: 0.45rem 0.6rem;
      text-align: center;
      border-bottom: 1px solid #1a2a1a;
      vertical-align: middle;
      min-width: 105px;
    }
    /* Row color accents */
    .row-merveille .cat-col { border-left: 3px solid #a07840; }
    .row-tresor    .cat-col { border-left: 3px solid #c9a84c; }
    .row-militaire .cat-col { border-left: 3px solid #c0392b; }
    .row-bleu      .cat-col { border-left: 3px solid #3b7fc1; }
    .row-jaune     .cat-col { border-left: 3px solid #c9a824; }
    .row-science   .cat-col { border-left: 3px solid #3a8a4a; }
    .row-violet    .cat-col { border-left: 3px solid #7b4fa0; }
    .row-total .cat-col,
    .row-total td { background: #0f1a0f; border-top: 2px solid #2a3a2a; }
    .row-total .cat-col { border-left: 3px solid #c9a84c; }

    .cat-name { font-size: 0.82rem; }
    .cat-hint { font-size: 0.63rem; color: #445544; margin-top: 0.08rem; }

    /* Inputs */
    .score-inp {
      width: 4rem; text-align: center;
      padding: 0.45rem 0.3rem;
      background: #0a0f0a; border: 1px solid #2a3a2a;
      border-radius: 8px; color: #f0ede6; font-size: 1.05rem; font-weight: bold; margin: 0;
    }
    .score-inp:focus { border-color: #80cc80; outline: none; }
    .score-inp::-webkit-inner-spin-button,
    .score-inp::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .score-inp, input[type=number] { -moz-appearance: textfield; }

    /* Trésor cell */
    .tresor-cell { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
    .tresor-pts  { font-size: 0.72rem; color: #c9a84c; white-space: nowrap; }

    /* Science cell */
    .sci-cell   { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
    .sci-inputs { display: flex; gap: 0.3rem; }
    .sci-sym    { display: flex; flex-direction: column; align-items: center; gap: 0.1rem; }
    .sci-sym span { font-size: 0.8rem; line-height: 1; }
    .sci-sym input {
      width: 2.1rem; text-align: center; padding: 0.3rem 0.1rem;
      background: #0a0f0a; border: 1px solid #2a3a2a; border-radius: 6px;
      color: #f0ede6; font-size: 0.88rem; margin: 0;
    }
    .sci-sym input:focus { border-color: #3a8a4a; outline: none; }
    .sci-pts { font-size: 0.72rem; color: #3a8a4a; font-weight: bold; }

    /* Total */
    .total-val { font-size: 1.5rem; font-weight: bold; color: #c9a84c; }
    .row-total .cat-col .cat-name { color: #c9a84c; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; }

    /* Ranking strip */
    .ranking-strip {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid #2a3a2a;
    }
    .rank-chip {
      padding: 0.3rem 0.75rem; border-radius: 20px;
      font-size: 0.82rem; font-weight: bold;
      border: 1px solid #2a3a2a; color: #a89f94;
    }
    .rank-chip.winner { background: rgba(201,168,76,0.12); border-color: #c9a84c; color: #c9a84c; }

    .row-cities .cat-col { border-left: 3px solid #666; }

    .score-actions {
      display: flex; gap: 0.6rem;
      padding: 0.5rem 1rem 0;
      align-items: center; flex-wrap: wrap;
    }
    .btn-reset {
      flex: 1;
      display: block; min-width: 120px;
      padding: 0.65rem; background: transparent;
      border: 1px solid #2a3a2a; border-radius: 10px;
      color: #556655; font-size: 0.88rem; cursor: pointer;
    }
    .btn-cities {
      padding: 0.65rem 1rem; background: transparent;
      border: 1px solid #444; border-radius: 10px;
      color: #888; font-size: 0.85rem; cursor: pointer;
      white-space: nowrap;
    }
    .btn-cities.active { border-color: #888; color: #ccc; background: rgba(255,255,255,0.05); }

    /* ── Mode clair ── */
    html.light body { background: #f5f3e8; }
    html.light .w7-topbar { background: #f0ede0; border-bottom-color: #dbd5c0; }
    html.light .w7-topbar a { color: #5a7a3a; }
    html.light .w7-topbar h1 { color: #2a1a00; }
    html.light .setup-lbl { color: #8a7a50; }
    html.light .nb-btn { border-color: #dbd5c0; color: #8a7a50; }
    html.light .nb-btn.active { border-color: #c9a84c; color: #7a5800; background: rgba(201,168,76,0.1); }
    html.light .score-inp { background: #fff; border-color: #dbd5c0; color: #2a1a00; }
    html.light .sci-sym input { background: #fff; border-color: #dbd5c0; color: #2a1a00; }
    html.light #player-header { background: #f0ede0; border-bottom-color: #dbd5c0; }
    html.light .ph-corner { background: #f0ede0; border-right-color: #dbd5c0; }
    html.light .score-table thead th { background: #f0ede0; border-bottom-color: #dbd5c0; }
    html.light .score-table .cat-col { background: #f5f3e8; border-right-color: #dbd5c0; }
    html.light .score-table thead .cat-col { background: #f0ede0; }
    html.light .score-table td { border-bottom-color: #eae5d0; }
    html.light .row-total .cat-col,
    html.light .row-total td { background: #f0ede0; border-top-color: #dbd5c0; }
    html.light .cat-hint { color: #8a7a50; }
    html.light .total-val { color: #7a5800; }
    html.light .ranking-strip { border-top-color: #dbd5c0; }
    html.light .rank-chip { border-color: #dbd5c0; color: #8a7a50; }
    html.light .rank-chip.winner { background: rgba(201,168,76,0.1); border-color: #c9a84c; color: #7a5800; }
    html.light .btn-reset { border-color: #dbd5c0; color: #8a7a50; }
    html.light .btn-cities { border-color: #bbb; color: #777; }
    html.light .btn-cities.active { border-color: #888; color: #333; background: rgba(0,0,0,0.04); }
  </style>
</head>
<body>
<div class="w7">

  <div class="w7-topbar" data-topbar>
    <a href="jeuxdesociete.html">&#8592;</a>
    <h1>🏛️ 7 Wonders — Score</h1>
  </div>

  <div id="w7-setup" class="w7-setup">
      <div class="setup-lbl">Nombre de joueurs</div>
      <div class="nb-btns" id="nb-btns"></div>
      <div class="setup-lbl">Noms des joueurs</div>
      <div id="noms"></div>
      <button class="btn-start" onclick="demarrer()">Commencer ▶</button>
    </div>

    <div id="w7-score" style="display:none;">
      <div id="player-header"></div>
      <div class="score-outer" id="score-outer">
        <table class="score-table" id="score-table"></table>
      </div>
      <div class="ranking-strip" id="ranking"></div>
      <div class="score-actions">
        <button class="btn-cities" id="btn-cities" onclick="toggleCities()">⬛ Cities</button>
        <button class="btn-reset" onclick="reinitialiser()">🔄 Nouvelle partie</button>
      </div>
    </div>

</div>

<script>
const COULEURS = ['#c9a84c','#5fb3ff','#c0392b','#27ae60','#9b59b6','#e67e22','#e91e8c'];
let nbJ = 3, joueurs = [];
let citiesActive = localStorage.getItem('w7cities') === 'true';

// ── Calculs ──────────────────────────────────────────
const sciPts    = (g,c,t) => g*g + c*c + t*t + 7*Math.min(g,c,t);
const tresorPts = p => Math.floor(p/3);
function total(s) {
  return s.merveille + tresorPts(s.pieces) + s.militaire + s.bleu + s.jaune + sciPts(s.gear,s.compass,s.tablet) + s.violet + (citiesActive ? (s.cities||0) : 0);
}
const newScores = () => ({ merveille:0, pieces:0, militaire:0, bleu:0, jaune:0, gear:0, compass:0, tablet:0, violet:0, cities:0 });

// ── Setup ─────────────────────────────────────────────
function initSetup() {
  const btns = document.getElementById('nb-btns');
  btns.innerHTML = '';
  [2,3,4,5,6,7].forEach(n => {
    const b = document.createElement('button');
    b.className = 'nb-btn' + (n===nbJ?' active':'');
    b.textContent = n;
    b.onclick = () => { nbJ=n; btns.querySelectorAll('.nb-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderNoms(); };
    btns.appendChild(b);
  });
  renderNoms();
}

function renderNoms() {
  const div = document.getElementById('noms');
  const vals = Array.from(div.querySelectorAll('input')).map(i=>i.value);
  div.innerHTML = '';
  for (let i=0; i<nbJ; i++) {
    const row = document.createElement('div');
    row.className = 'name-row';
    const num = document.createElement('div');
    num.className = 'name-num';
    num.style.cssText = `background:${COULEURS[i]}22;color:${COULEURS[i]}`;
    num.textContent = i+1;
    const inp = document.createElement('input');
    inp.className = 'player-name-input'; inp.type = 'text';
    inp.placeholder = `Joueur ${i+1}`; inp.value = vals[i]||'';
    row.appendChild(num); row.appendChild(inp);
    div.appendChild(row);
  }
}

function demarrer() {
  const inputs = document.querySelectorAll('#noms input');
  joueurs = Array.from(inputs).map((inp,i) => ({
    nom: inp.value.trim() || `Joueur ${i+1}`,
    scores: newScores()
  }));
  document.getElementById('w7-setup').style.display = 'none';
  document.getElementById('w7-score').style.display  = '';
  buildTable();
  buildPlayerHeader();
  updatePlayerHeaderTop();
  syncCitiesBtn();
}

function toggleCities() {
  citiesActive = !citiesActive;
  localStorage.setItem('w7cities', citiesActive);
  syncCitiesBtn();
  if (joueurs.length) { buildTable(); buildPlayerHeader(); }
}

function syncCitiesBtn() {
  const btn = document.getElementById('btn-cities');
  if (!btn) return;
  btn.classList.toggle('active', citiesActive);
  btn.textContent = citiesActive ? '⬛ Cities : ON' : '⬛ Cities';
}

function buildPlayerHeader() {
  const bar = document.getElementById('player-header');
  if (!bar) return;
  bar.innerHTML = '';

  const corner = document.createElement('div');
  corner.className = 'ph-corner';
  corner.textContent = 'Catégorie';
  bar.appendChild(corner);

  joueurs.forEach((j, i) => {
    const cell = document.createElement('div');
    cell.className = 'ph-cell';
    const dot = document.createElement('span');
    dot.style.cssText = `display:inline-block;width:8px;height:8px;border-radius:50%;background:${COULEURS[i]};margin-right:5px;vertical-align:middle;`;
    const nameSpan = document.createElement('span');
    nameSpan.style.color = COULEURS[i];
    nameSpan.textContent = j.nom;
    cell.appendChild(dot);
    cell.appendChild(nameSpan);
    bar.appendChild(cell);
  });

  // Sync largeurs sur les colonnes réelles du tableau (après rendu)
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const firstRow = document.querySelector('#score-table tbody tr');
    if (!firstRow) return;
    const tds = firstRow.querySelectorAll('td');
    const hcells = bar.querySelectorAll('.ph-corner, .ph-cell');
    tds.forEach((td, i) => {
      if (hcells[i]) {
        const w = td.getBoundingClientRect().width;
        hcells[i].style.minWidth = w + 'px';
        hcells[i].style.maxWidth = w + 'px';
        hcells[i].style.width    = w + 'px';
      }
    });
  }));

  // Sync horizontal scroll avec le tableau
  const outer = document.getElementById('score-outer');
  if (outer) {
    outer.addEventListener('scroll', function () {
      bar.scrollLeft = this.scrollLeft;
    }, { passive: true });
  }
}

function updatePlayerHeaderTop() {
  const topbar = document.querySelector('.w7-topbar');
  const bar    = document.getElementById('player-header');
  if (!bar) return;
  bar.style.top = (topbar ? topbar.offsetHeight : 0) + 'px';
}

// ── Table ─────────────────────────────────────────────
const ROWS_BASE = [
  { cls:'merveille', label:'🏛️ Merveille',  hint:'Points des étapes',         key:'merveille', color:'#a07840', type:'simple' },
  { cls:'tresor',    label:'💰 Trésor',       hint:'Pièces ÷ 3 = points',       key:'pieces',    color:'#c9a84c', type:'tresor' },
  { cls:'militaire', label:'⚔️ Militaires', hint:'Jetons (peut être négatif)', key:'militaire', color:'#c0392b', type:'simple', neg:true },
  { cls:'bleu',      label:'🔵 Civils',       hint:'Cartes Bleues',              key:'bleu',      color:'#3b7fc1', type:'simple' },
  { cls:'jaune',     label:'🟡 Commerce',     hint:'Cartes Jaunes',              key:'jaune',     color:'#c9a824', type:'simple' },
  { cls:'science',   label:'🔬 Sciences',     hint:'⚙️ 📐 📜 — Cartes Vertes',  key:null,        color:'#3a8a4a', type:'science' },
  { cls:'violet',    label:'🟣 Guildes',      hint:'Cartes Violettes',           key:'violet',    color:'#7b4fa0', type:'simple' },
];
const ROW_CITIES = { cls:'cities', label:'⬛ Cités', hint:'Extension Cities', key:'cities', color:'#888', type:'simple', neg:true };
const ROW_TOTAL  = { cls:'total',  label:'TOTAL',    hint:'',                  key:null,     color:'#c9a84c', type:'total' };
const getRows = () => [...ROWS_BASE, ...(citiesActive ? [ROW_CITIES] : []), ROW_TOTAL];

function buildTable() {
  const table = document.getElementById('score-table');
  table.innerHTML = '';

  // ── THEAD ──
  const thead = document.createElement('thead');
  const headTr = document.createElement('tr');
  const cornerTh = document.createElement('th');
  cornerTh.className = 'cat-col';
  cornerTh.textContent = 'Catégorie';
  headTr.appendChild(cornerTh);
  joueurs.forEach((j,i) => {
    const th = document.createElement('th');
    const dot = document.createElement('span');
    dot.style.cssText = `display:inline-block;width:8px;height:8px;border-radius:50%;background:${COULEURS[i]};margin-right:5px;vertical-align:middle;`;
    const nameSpan = document.createElement('span');
    nameSpan.style.color = COULEURS[i]; nameSpan.textContent = j.nom;
    th.appendChild(dot); th.appendChild(nameSpan);
    headTr.appendChild(th);
  });
  thead.appendChild(headTr);
  table.appendChild(thead);

  // ── TBODY ──
  const tbody = document.createElement('tbody');
  getRows().forEach(def => {
    const tr = document.createElement('tr');
    tr.className = `row-${def.cls}`;

    // Category cell
    const catTd = document.createElement('td');
    catTd.className = 'cat-col';
    catTd.innerHTML = `<div class="cat-name" style="color:${def.color}">${def.label}</div>${def.hint?`<div class="cat-hint">${def.hint}</div>`:''}`;
    tr.appendChild(catTd);

    // Player cells
    joueurs.forEach((j,idx) => {
      const td = document.createElement('td');
      const s = j.scores;

      if (def.type === 'simple') {
        const inp = document.createElement('input');
        inp.type='text'; inp.inputMode=def.neg ? 'text' : 'numeric'; inp.className='score-inp'; if(s[def.key]) inp.value=s[def.key];
        inp.oninput = () => { s[def.key]=parseInt(inp.value)||0; updateTotaux(); };
        td.appendChild(inp);

      } else if (def.type === 'tresor') {
        const wrap=document.createElement('div'); wrap.className='tresor-cell';
        const inp=document.createElement('input');
        inp.type='text'; inp.inputMode='numeric'; inp.className='score-inp'; if(s.pieces) inp.value=s.pieces;
        const pts=document.createElement('div'); pts.className='tresor-pts'; pts.id=`trp-${idx}`;
        pts.textContent=`= ${tresorPts(s.pieces)} pts`;
        inp.oninput=()=>{ s.pieces=parseInt(inp.value)||0; pts.textContent=`= ${tresorPts(s.pieces)} pts`; updateTotaux(); };
        wrap.appendChild(inp); wrap.appendChild(pts); td.appendChild(wrap);

      } else if (def.type === 'science') {
        const cell=document.createElement('div'); cell.className='sci-cell';
        const row=document.createElement('div'); row.className='sci-inputs';
        const pDiv=document.createElement('div'); pDiv.className='sci-pts'; pDiv.id=`scp-${idx}`;
        pDiv.textContent=`${sciPts(s.gear,s.compass,s.tablet)} pts`;
        [['gear','⚙️'],['compass','📐'],['tablet','📜']].forEach(([k,ico])=>{
          const sw=document.createElement('div'); sw.className='sci-sym';
          sw.innerHTML=`<span>${ico}</span>`;
          const inp=document.createElement('input');
          inp.type='text'; inp.inputMode='numeric'; if(s[k]) inp.value=s[k];
          inp.oninput=()=>{ s[k]=parseInt(inp.value)||0; pDiv.textContent=`${sciPts(s.gear,s.compass,s.tablet)} pts`; updateTotaux(); };
          sw.appendChild(inp); row.appendChild(sw);
        });
        cell.appendChild(row); cell.appendChild(pDiv); td.appendChild(cell);

      } else if (def.type === 'total') {
        const v=document.createElement('div'); v.className='total-val'; v.id=`tot-${idx}`;
        v.textContent=total(s); td.appendChild(v);
      }

      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  renderRanking();
}

function updateTotaux() {
  joueurs.forEach((j,idx) => {
    const el = document.getElementById(`tot-${idx}`);
    if (el) el.textContent = total(j.scores);
  });
  renderRanking();
}

function renderRanking() {
  const div = document.getElementById('ranking');
  if (!div) return;
  const medals = ['🥇','🥈','🥉'];
  const ranked = joueurs.map((j,i)=>({nom:j.nom,pts:total(j.scores),c:COULEURS[i]})).sort((a,b)=>b.pts-a.pts);
  div.innerHTML = '';
  ranked.forEach((r,i) => {
    const chip = document.createElement('span');
    chip.className = 'rank-chip' + (i===0 ? ' winner' : '');
    chip.style.cssText = i===0 ? `color:${r.c};border-color:${r.c}40` : `color:${r.c}80;border-color:${r.c}30`;
    chip.textContent = `${medals[i]||`${i+1}.`} ${r.nom} — ${r.pts}`;
    div.appendChild(chip);
  });
}

function reinitialiser() {
  joueurs=[];
  document.getElementById('w7-score').style.display='none';
  document.getElementById('w7-setup').style.display='';
  initSetup();
}

initSetup();
syncCitiesBtn();

// ── Fix iOS Safari : sticky échappe au viewport visuel quand le clavier apparaît ──
function fixStickyiOS() {
  const vv = window.visualViewport;
  if (!vv) return;
  const vvTop = Math.round(vv.offsetTop);

  const topbar = document.querySelector('.w7-topbar');
  if (topbar) topbar.style.top = vvTop + 'px';

  const topbarH = topbar ? topbar.offsetHeight : 0;

  const bar = document.getElementById('player-header');
  if (bar) bar.style.top = (vvTop + topbarH) + 'px';
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('scroll', fixStickyiOS, { passive: true });
  window.visualViewport.addEventListener('resize', fixStickyiOS, { passive: true });
} else {
  window.addEventListener('resize', updatePlayerHeaderTop);
}
