<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Wonders — Score</title>
  <link rel="stylesheet" href="style.css">
  <script>
    const _p7 = JSON.parse(sessionStorage.getItem('userPermissions') || '[]');
    if (!sessionStorage.getItem('loggedIn') ||
        (!_p7.includes('jeuxdesociete') && sessionStorage.getItem('userRole') !== 'admin')) {
      window.location.href = 'dashboard.html';
    }
  </script>
  <style>
    body { align-items: flex-start; }

    .w7 {
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 4rem;
    }

    /* ── Topbar ── */
    .w7-topbar {
      position: sticky; top: 0; z-index: 100;
      background: #0f1a0f;
      border-bottom: 1px solid #2a3a2a;
      padding: 0.65rem 1rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .w7-topbar a { color: #80cc80; text-decoration: none; font-size: 1.3rem; padding: 0.2rem; }
    .w7-topbar h1 { font-size: 1rem; color: #f0ede6; margin: 0; flex: 1; }

    /* ── Tabs ── */
    .w7-tabs {
      display: flex;
      border-bottom: 1px solid #2a3a2a;
    }
    .w7-tab {
      flex: 1; padding: 0.7rem; background: transparent;
      border: none; border-bottom: 2px solid transparent;
      color: #556655; font-size: 0.9rem; cursor: pointer;
      margin-bottom: -1px; transition: color 0.15s, border-color 0.15s;
    }
    .w7-tab.active { color: #c9a84c; border-bottom-color: #c9a84c; font-weight: bold; }

    /* ── Setup ── */
    .w7-setup { padding: 1rem; }
    .setup-label { font-size: 0.75rem; color: #556655; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .nb-btns { display: flex; gap: 0.4rem; margin-bottom: 1.25rem; }
    .nb-btn {
      width: 2.5rem; height: 2.5rem; border-radius: 50%;
      border: 2px solid #2a3a2a; background: transparent;
      color: #556655; font-size: 1rem; font-weight: bold; cursor: pointer;
      transition: all 0.15s;
    }
    .nb-btn.active { border-color: #c9a84c; color: #c9a84c; background: rgba(201,168,76,0.1); }
    .name-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
    .name-num {
      width: 1.6rem; height: 1.6rem; border-radius: 50%;
      font-size: 0.75rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-start {
      display: block; width: 100%; margin-top: 1.25rem;
      padding: 0.85rem; background: #c9a84c; color: #0a0f0a;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer;
    }

    /* ── Player cards ── */
    .p-card {
      margin: 0.75rem 1rem 0;
      border-radius: 12px; overflow: hidden;
      border: 1px solid #2a3a2a;
    }
    .p-card-header {
      padding: 0.6rem 1rem; font-weight: bold; font-size: 0.95rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .p-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    .score-row {
      display: flex; align-items: center;
      padding: 0.55rem 1rem; gap: 0.75rem;
      border-top: 1px solid #1a2a1a;
    }
    .score-lbl { flex: 1; min-width: 0; }
    .score-lbl .sn { font-size: 0.82rem; }
    .score-lbl .sh { font-size: 0.67rem; color: #445544; margin-top: 0.05rem; }
    .score-inp {
      width: 3.5rem; text-align: center; padding: 0.4rem;
      background: #0a0f0a; border: 1px solid #2a3a2a; border-radius: 8px;
      color: #f0ede6; font-size: 1rem; font-weight: bold; margin: 0;
    }
    .score-inp:focus { border-color: #80cc80; outline: none; }
    .score-calc {
      min-width: 3rem; text-align: right;
      font-size: 0.8rem; font-weight: bold; color: #80cc80;
      flex-shrink: 0;
    }

    /* Sciences */
    .sci-wrap { display: flex; gap: 0.5rem; align-items: center; }
    .sci-sym { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; }
    .sci-sym .si { font-size: 0.85rem; line-height: 1; }
    .sci-sym input {
      width: 2.6rem; text-align: center; padding: 0.35rem 0.2rem;
      background: #0a0f0a; border: 1px solid #2a3a2a; border-radius: 6px;
      color: #f0ede6; font-size: 0.95rem; margin: 0;
    }
    .sci-sym input:focus { border-color: #3a8a4a; outline: none; }

    /* Total */
    .total-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.7rem 1rem; border-top: 2px solid #2a3a2a;
      background: #0f1a0f;
    }
    .total-lbl { font-size: 0.75rem; color: #80cc80; font-weight: bold; letter-spacing: 0.1em; text-transform: uppercase; }
    .total-val { font-size: 1.8rem; font-weight: bold; color: #c9a84c; }

    /* Summary */
    .w7-summary {
      margin: 0.75rem 1rem 0;
      border: 1px solid #2a3a2a; border-radius: 12px; overflow: hidden;
    }
    .sum-header {
      padding: 0.6rem 1rem; background: #1a2e1a;
      font-size: 0.75rem; color: #80cc80; font-weight: bold; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .sum-row {
      display: flex; align-items: center; padding: 0.6rem 1rem;
      border-top: 1px solid #1a2a1a; gap: 0.6rem;
    }
    .sum-row.winner { background: rgba(201,168,76,0.08); }
    .sum-medal { font-size: 1rem; width: 1.5rem; flex-shrink: 0; }
    .sum-name { flex: 1; font-size: 0.9rem; }
    .sum-score { font-size: 1.1rem; font-weight: bold; color: #c9a84c; }

    /* Reset btn */
    .btn-reset {
      display: block; width: calc(100% - 2rem); margin: 0.75rem 1rem 0;
      padding: 0.7rem; background: transparent;
      border: 1px solid #2a3a2a; border-radius: 10px;
      color: #556655; font-size: 0.9rem; cursor: pointer;
    }

    /* ── Règles ── */
    .reg-sec { margin: 0.5rem 1rem 0; border: 1px solid #2a3a2a; border-radius: 10px; overflow: hidden; }
    .reg-btn {
      width: 100%; text-align: left; padding: 0.75rem 1rem;
      background: #0f1a0f; border: none; color: #f0ede6;
      font-size: 0.88rem; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
    }
    .reg-btn.open { color: #c9a84c; }
    .reg-chev { transition: transform 0.2s; font-style: normal; }
    .reg-btn.open .reg-chev { transform: rotate(90deg); }
    .reg-body {
      display: none; padding: 0.75rem 1rem;
      font-size: 0.82rem; color: #a89f94; line-height: 1.65;
      border-top: 1px solid #1a2a1a; background: #0a0f0a;
    }
    .reg-body.open { display: block; }
    .reg-body b { color: #f0ede6; }
    .reg-body .sci-table {
      width: 100%; border-collapse: collapse; margin: 0.5rem 0; font-size: 0.8rem;
    }
    .reg-body .sci-table th, .reg-body .sci-table td {
      padding: 0.3rem 0.5rem; border: 1px solid #2a3a2a; text-align: center;
    }
    .reg-body .sci-table th { background: #1a2e1a; color: #80cc80; }
    .reg-body .exemple { margin-top: 0.5rem; color: #80cc80; font-style: italic; }
    .reg-body ol, .reg-body ul { padding-left: 1.2rem; }
    .reg-body li { margin-bottom: 0.3rem; }
  </style>
</head>
<body>
<div class="w7">

  <div class="w7-topbar">
    <a href="jeuxdesociete.html">&#8592;</a>
    <h1>🏛️ 7 Wonders — Score</h1>
  </div>

  <div class="w7-tabs">
    <button class="w7-tab active" onclick="showTab('score',this)">🏆 Score</button>
    <button class="w7-tab"        onclick="showTab('regles',this)">📖 Règles</button>
  </div>

  <!-- ── Tab Score ── -->
  <div id="tab-score">

    <div id="w7-setup" class="w7-setup">
      <div class="setup-label">Nombre de joueurs</div>
      <div class="nb-btns" id="nb-btns"></div>
      <div class="setup-label">Noms des joueurs</div>
      <div id="noms"></div>
      <button class="btn-start" onclick="demarrer()">Commencer ▶</button>
    </div>

    <div id="w7-score" style="display:none;">
      <div id="player-cards"></div>
      <div id="summary"></div>
      <button class="btn-reset" onclick="reinitialiser()">🔄 Nouvelle partie</button>
    </div>

  </div>

  <!-- ── Tab Règles ── -->
  <div id="tab-regles" style="display:none; padding-bottom:1rem;"></div>

</div>

<script>
const COULEURS = ['#c9a84c','#5fb3ff','#c0392b','#27ae60','#9b59b6','#e67e22','#e91e8c'];
let nbJ = 3, joueurs = [];

// ── Calculs ──────────────────────────────────────────
const sciPts = (g,c,t) => g*g + c*c + t*t + 7*Math.min(g,c,t);
const tresorPts = p => Math.floor(p/3);
function total(s) {
  return s.merveille + tresorPts(s.pieces) + s.militaire + s.bleu + s.jaune + sciPts(s.gear,s.compass,s.tablet) + s.violet;
}
const newScores = () => ({ merveille:0, pieces:0, militaire:0, bleu:0, jaune:0, gear:0, compass:0, tablet:0, violet:0 });

// ── Setup ─────────────────────────────────────────────
function initSetup() {
  const btns = document.getElementById('nb-btns');
  btns.innerHTML = '';
  [2,3,4,5,6,7].forEach(n => {
    const b = document.createElement('button');
    b.className = 'nb-btn' + (n === nbJ ? ' active' : '');
    b.textContent = n;
    b.onclick = () => {
      nbJ = n;
      btns.querySelectorAll('.nb-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      renderNoms();
    };
    btns.appendChild(b);
  });
  renderNoms();
}

function renderNoms() {
  const div = document.getElementById('noms');
  const vals = Array.from(div.querySelectorAll('input')).map(i => i.value);
  div.innerHTML = '';
  for (let i = 0; i < nbJ; i++) {
    const row = document.createElement('div');
    row.className = 'name-row';
    const num = document.createElement('div');
    num.className = 'name-num';
    num.style.cssText = `background:${COULEURS[i]}22;color:${COULEURS[i]}`;
    num.textContent = i+1;
    const inp = document.createElement('input');
    inp.className = 'player-name-input';
    inp.type = 'text';
    inp.placeholder = `Joueur ${i+1}`;
    inp.value = vals[i] || '';
    row.appendChild(num);
    row.appendChild(inp);
    div.appendChild(row);
  }
}

function demarrer() {
  const inputs = document.querySelectorAll('#noms input');
  joueurs = Array.from(inputs).map((inp, i) => ({
    nom: inp.value.trim() || `Joueur ${i+1}`,
    scores: newScores()
  }));
  document.getElementById('w7-setup').style.display = 'none';
  document.getElementById('w7-score').style.display  = '';
  renderCards();
}

// ── Score cards ───────────────────────────────────────
function updateAll() {
  joueurs.forEach((j, idx) => {
    const el = document.getElementById(`tot-${idx}`);
    if (el) el.textContent = total(j.scores);
  });
  renderSummary();
}

function renderCards() {
  const container = document.getElementById('player-cards');
  container.innerHTML = '';

  joueurs.forEach((j, idx) => {
    const c = COULEURS[idx];
    const s = j.scores;
    const card = document.createElement('div');
    card.className = 'p-card';
    card.style.borderColor = c + '55';

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'p-card-header';
    hdr.style.background = c + '18';
    hdr.innerHTML = `<span class="p-dot" style="background:${c}"></span>${j.nom}`;
    card.appendChild(hdr);

    // Rows config
    const rows = [
      { key:'merveille', label:'🏛️ Merveille',          hint:'Points des étapes construites',             color:'#a07840', type:'simple' },
      { key:'pieces',    label:'💰 Trésor',               hint:'Nombre de pièces (÷3 = pts)',               color:'#c9a84c', type:'tresor' },
      { key:'militaire', label:'⚔️ Conflits militaires', hint:'Somme des jetons (peut être négatif)',       color:'#c0392b', type:'simple', neg:true },
      { key:'bleu',      label:'🔵 Civils',               hint:'Points des cartes Bleues',                  color:'#3b7fc1', type:'simple' },
      { key:'jaune',     label:'🟡 Commerce',             hint:'Points des cartes Jaunes',                  color:'#c9a824', type:'simple' },
      { key:'science',   label:'🔬 Sciences',             hint:'Cartes Vertes — ⚙️ 📐 📜',                  color:'#3a8a4a', type:'science' },
      { key:'violet',    label:'🟣 Guildes',              hint:'Points des cartes Violettes',               color:'#7b4fa0', type:'simple' },
    ];

    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'score-row';

      const lbl = document.createElement('div');
      lbl.className = 'score-lbl';
      lbl.innerHTML = `<div class="sn" style="color:${r.color}">${r.label}</div><div class="sh">${r.hint}</div>`;
      row.appendChild(lbl);

      if (r.type === 'simple') {
        const inp = document.createElement('input');
        inp.type = 'number'; inp.inputMode = 'numeric';
        inp.className = 'score-inp'; inp.value = s[r.key];
        if (!r.neg) inp.min = 0;
        inp.oninput = () => { s[r.key] = parseInt(inp.value) || 0; updateAll(); };
        row.appendChild(inp);

      } else if (r.type === 'tresor') {
        const inp = document.createElement('input');
        inp.type = 'number'; inp.inputMode = 'numeric';
        inp.className = 'score-inp'; inp.min = 0; inp.value = s.pieces;
        const calc = document.createElement('div');
        calc.className = 'score-calc'; calc.style.color = r.color;
        calc.textContent = `= ${tresorPts(s.pieces)} pts`;
        inp.oninput = () => {
          s.pieces = parseInt(inp.value) || 0;
          calc.textContent = `= ${tresorPts(s.pieces)} pts`;
          updateAll();
        };
        row.appendChild(inp);
        row.appendChild(calc);

      } else if (r.type === 'science') {
        const syms = [
          { k:'gear',    icon:'⚙️'  },
          { k:'compass', icon:'📐' },
          { k:'tablet',  icon:'📜' },
        ];
        const wrap = document.createElement('div');
        wrap.className = 'sci-wrap';
        const calc = document.createElement('div');
        calc.className = 'score-calc'; calc.style.color = r.color;
        calc.textContent = `${sciPts(s.gear,s.compass,s.tablet)} pts`;

        syms.forEach(sym => {
          const box = document.createElement('div');
          box.className = 'sci-sym';
          box.innerHTML = `<span class="si">${sym.icon}</span>`;
          const inp = document.createElement('input');
          inp.type = 'number'; inp.inputMode = 'numeric'; inp.min = 0; inp.value = s[sym.k];
          inp.oninput = () => {
            s[sym.k] = parseInt(inp.value) || 0;
            calc.textContent = `${sciPts(s.gear,s.compass,s.tablet)} pts`;
            updateAll();
          };
          box.appendChild(inp);
          wrap.appendChild(box);
        });
        row.appendChild(wrap);
        row.appendChild(calc);
      }

      card.appendChild(row);
    });

    // Total
    const totRow = document.createElement('div');
    totRow.className = 'total-row';
    totRow.innerHTML = `<span class="total-lbl">Total</span><span class="total-val" id="tot-${idx}">${total(s)}</span>`;
    card.appendChild(totRow);

    container.appendChild(card);
  });

  renderSummary();
}

function renderSummary() {
  const div = document.getElementById('summary');
  if (!div) return;
  const ranked = joueurs
    .map((j, i) => ({ nom:j.nom, pts:total(j.scores), c:COULEURS[i] }))
    .sort((a,b) => b.pts - a.pts);

  div.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'w7-summary';
  const hdr = document.createElement('div');
  hdr.className = 'sum-header'; hdr.textContent = '🏆 Classement';
  box.appendChild(hdr);

  const medals = ['🥇','🥈','🥉'];
  ranked.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'sum-row' + (i===0 ? ' winner' : '');
    row.innerHTML = `
      <span class="sum-medal">${medals[i] || (i+1)+'.'}</span>
      <span class="sum-name" style="color:${r.c}">${r.nom}</span>
      <span class="sum-score">${r.pts}</span>`;
    box.appendChild(row);
  });
  div.appendChild(box);
}

function reinitialiser() {
  joueurs = [];
  document.getElementById('w7-score').style.display  = 'none';
  document.getElementById('w7-setup').style.display  = '';
  initSetup();
}

// ── Tabs ─────────────────────────────────────────────
function showTab(name, btn) {
  document.getElementById('tab-score').style.display  = name==='score'  ? '' : 'none';
  document.getElementById('tab-regles').style.display = name==='regles' ? '' : 'none';
  document.querySelectorAll('.w7-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── Règles ────────────────────────────────────────────
function renderRegles() {
  const div = document.getElementById('tab-regles');
  const sections = [
    {
      t: '🏆 Décompte des points — ordre officiel',
      b: `<ol>
        <li><b>🏛️ Merveille</b> — Points des étapes construites</li>
        <li><b>💰 Trésor</b> — 1 pt par lot complet de 3 Pièces</li>
        <li><b>⚔️ Conflits militaires</b> — Somme de tous les jetons Victoire et Défaite</li>
        <li><b>🔵 Cartes Bleues</b> — Points des bâtiments civils</li>
        <li><b>🟡 Cartes Jaunes</b> — Points des cartes commerciales</li>
        <li><b>🔬 Sciences (Vertes)</b> — Symboles identiques² + lots de 3 différents</li>
        <li><b>🟣 Cartes Violettes</b> — Points des guildes</li>
      </ol>
      <p style="margin-top:0.5rem;"><b>Égalité :</b> le joueur ayant le plus gros Trésor l'emporte.</p>`
    },
    {
      t: '🔬 Calcul des sciences (Cartes Vertes)',
      b: `<p>Additionner les deux méthodes :</p>
      <p style="margin-top:0.5rem;"><b>Par type de symbole</b> — nombre de symboles au carré :</p>
      <table class="sci-table">
        <tr><th>Symboles identiques</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
        <tr><td>Points de victoire</td><td>1</td><td>4</td><td>9</td><td>16</td><td>25</td><td>36</td></tr>
      </table>
      <p style="margin-top:0.5rem;"><b>Lot de 3 symboles différents</b> (⚙️ + 📐 + 📜) : <b>+7 pts</b> par lot complet</p>
      <p class="exemple">Ex. : 3⚙️ + 2📐 + 2📜 → 9+4+4 = 17 pts + 2 lots×7 = 14 pts = <b>31 pts</b></p>`
    },
    {
      t: '⚔️ Conflits militaires',
      b: `<p>À la fin de chaque Âge, compare ta force militaire avec chacun de tes 2 voisins :</p>
      <table class="sci-table" style="margin-top:0.5rem;">
        <tr><th>Âge</th><th>Victoire</th><th>Défaite</th><th>Égalité</th></tr>
        <tr><td>I</td><td style="color:#27ae60;">+1 pt</td><td style="color:#c0392b;">-1 pt</td><td>0</td></tr>
        <tr><td>II</td><td style="color:#27ae60;">+3 pts</td><td style="color:#c0392b;">-1 pt</td><td>0</td></tr>
        <tr><td>III</td><td style="color:#27ae60;">+5 pts</td><td style="color:#c0392b;">-1 pt</td><td>0</td></tr>
      </table>
      <p style="margin-top:0.5rem;">Le score militaire total peut être <b>négatif</b> (plusieurs défaites).</p>`
    },
    {
      t: '💰 Ressources et achat chez un voisin',
      b: `<p><b>Ressources disponibles :</b> ressource de départ (plateau Merveille) + cartes Marrons et Grises construites + étapes de Merveille + certaines cartes Jaunes.</p>
      <p style="margin-top:0.5rem;"><b>Acheter à un voisin :</b> 2 Pièces par ressource achetée (payées au voisin). Certaines cartes Jaunes réduisent ce coût à 1 Pièce.</p>
      <p style="margin-top:0.5rem;"><b>Ressource au choix</b> (carte produisant « 1 parmi X ») : une seule ressource choisie au moment de la construction.</p>
      <p style="margin-top:0.5rem;"><b>Chaque ressource ne peut être utilisée qu'une seule fois par tour.</b></p>`
    },
    {
      t: '🔗 Chaînage — construction gratuite',
      b: `<p>À partir de l'Âge II, certaines cartes ont un <b>symbole de chaînage</b> dans leur zone de coût (coin supérieur droit).</p>
      <p style="margin-top:0.5rem;">Si tu possèdes déjà une carte avec ce même symbole, tu construis la nouvelle carte <b>gratuitement</b> (sans ressources, sans Pièces).</p>
      <p style="margin-top:0.5rem;">Certaines cartes ont <b>deux symboles de chaînage</b> : l'un pour la recevoir gratuitement, l'autre pour en débloquer une autre.</p>`
    },
    {
      t: '🔄 Vendre une carte (défausser)',
      b: `<p>À chaque tour tu peux choisir de <b>défausser ta carte</b> (face cachée au centre de la table) plutôt que de la construire.</p>
      <p style="margin-top:0.5rem;">Tu reçois immédiatement <b>3 Pièces</b> de la réserve.</p>
      <p style="margin-top:0.5rem;">C'est une action toujours disponible, même si tu n'as pas les ressources pour construire.</p>`
    },
    {
      t: '🏗️ Construire une étape de Merveille',
      b: `<p>Pour construire une étape de ta Merveille, place <b>n'importe quelle carte de ta main face cachée</b> sous ton plateau en payant le coût de l'étape.</p>
      <p style="margin-top:0.5rem;">Les étapes se construisent <b>de gauche à droite</b> (dans l'ordre obligatoirement).</p>
      <p style="margin-top:0.5rem;">La construction est <b>optionnelle</b> — tu n'es pas obligé de construire toutes les étapes.</p>
      <p style="margin-top:0.5rem;">Tu peux construire plusieurs étapes dans la même partie, mais <b>une seule par tour</b>.</p>`
    },
  ];

  sections.forEach(sec => {
    const wrap = document.createElement('div');
    wrap.className = 'reg-sec';
    const btn = document.createElement('button');
    btn.className = 'reg-btn';
    btn.innerHTML = `<span>${sec.t}</span><i class="reg-chev">›</i>`;
    const body = document.createElement('div');
    body.className = 'reg-body';
    body.innerHTML = sec.b;
    btn.onclick = () => {
      const open = body.classList.toggle('open');
      btn.classList.toggle('open', open);
    };
    wrap.appendChild(btn);
    wrap.appendChild(body);
    div.appendChild(wrap);
  });
}

initSetup();
renderRegles();
</script>

<div data-version-badge style="position:fixed;bottom:1rem;left:1rem;background:red;color:white;font-weight:bold;font-size:0.8rem;padding:0.3rem 0.6rem;border-radius:5px;z-index:9999;"></div>
<script src="version.js"></script>
</body>
