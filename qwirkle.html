<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwirkle — Score</title>
  <link rel="stylesheet" href="style.css">
  <script>
    const _pQ = JSON.parse(sessionStorage.getItem('userPermissions') || '[]');
    if (!sessionStorage.getItem('loggedIn') ||
        (!_pQ.includes('jeuxdesociete') && sessionStorage.getItem('userRole') !== 'admin')) {
      window.location.href = 'dashboard.html';
    }
  </script>
  <style>
    body { align-items: flex-start; }
    .qwk { width: 100%; padding-bottom: 2rem; }

    .qwk-topbar {
      position: sticky; top: 0; z-index: 100;
      background: #0f1a0f; border-bottom: 1px solid #2a3a2a;
      padding: 0.6rem 1rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .qwk-topbar a { color: #80cc80; text-decoration: none; font-size: 1.3rem; }
    .qwk-topbar h1 { font-size: 1rem; color: #f0ede6; margin: 0; flex: 1; }

    /* Setup */
    .qwk-setup { padding: 1.25rem; max-width: 400px; margin: 0 auto; }
    .setup-lbl { font-size: 0.72rem; color: #556655; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .nb-btns { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .nb-btn {
      width: 2.6rem; height: 2.6rem; border-radius: 50%;
      border: 2px solid #2a3a2a; background: transparent;
      color: #556655; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.15s;
    }
    .nb-btn.active { border-color: #c9a84c; color: #c9a84c; background: rgba(201,168,76,0.1); }
    .name-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
    .name-num {
      width: 1.7rem; height: 1.7rem; border-radius: 50%; flex-shrink: 0;
      font-size: 0.75rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
    }
    .player-name-input {
      flex: 1; padding: 0.6rem 0.75rem;
      background: #0f1a0f; border: 1px solid #2a3a2a; border-radius: 8px;
      color: #f0ede6; font-size: 0.95rem; margin: 0;
    }
    .player-name-input:focus { border-color: #80cc80; outline: none; }
    .btn-start {
      display: block; width: 100%; margin-top: 1.25rem;
      padding: 0.9rem; background: #c9a84c; color: #0a0f0a;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer;
    }

    /* Grid de cartes */
    .qwk-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }

    .qwk-card {
      background: #0f1a0f;
      border: 2px solid #1a2a1a;
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: border-color 0.2s;
    }
    .qwk-card.leader { border-color: rgba(201,168,76,0.5); }

    .qwk-header { display: flex; align-items: center; justify-content: space-between; }
    .qwk-nom { font-size: 1rem; font-weight: bold; }

    .qwk-total {
      font-size: 4rem; font-weight: bold; color: #f0ede6;
      text-align: center; line-height: 1; padding: 0.4rem 0;
    }

    .qwk-add-row { display: flex; gap: 0.5rem; }
    .qwk-pts-input {
      flex: 1; text-align: center; padding: 0.65rem;
      background: #0a0f0a; border: 1px solid #2a3a2a;
      border-radius: 10px; color: #f0ede6; font-size: 1.2rem; font-weight: bold; margin: 0;
    }
    .qwk-pts-input:focus { border-color: #80cc80; outline: none; }
    .qwk-pts-input::-webkit-inner-spin-button,
    .qwk-pts-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .qwk-pts-input { -moz-appearance: textfield; }

    .qwk-btn-add {
      width: 3rem; height: 3rem; flex-shrink: 0;
      background: #0f2a0f; border: 1px solid #27ae60;
      border-radius: 10px; color: #27ae60; font-size: 1.5rem;
      font-weight: bold; cursor: pointer; margin: 0; padding: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .qwk-btn-qwirkle {
      width: 100%;
      background: rgba(201,168,76,0.08);
      border: 2px solid #c9a84c;
      border-radius: 12px;
      color: #c9a84c;
      font-size: 1rem;
      font-weight: bold;
      padding: 0.8rem;
      cursor: pointer;
      margin: 0;
      letter-spacing: 0.04em;
      transition: background 0.1s, transform 0.1s;
    }
    .qwk-btn-qwirkle:active { transform: scale(0.97); }
    @keyframes qwirkle-flash {
      0%   { background: rgba(201,168,76,0.55); }
      100% { background: rgba(201,168,76,0.08); }
    }
    .qwk-btn-qwirkle.flash { animation: qwirkle-flash 0.6s ease-out; }

    .btn-new-game {
      display: block; width: calc(100% - 2rem); margin: 0.25rem 1rem 0;
      padding: 0.65rem; background: transparent;
      border: 1px solid #2a3a2a; border-radius: 10px;
      color: #556655; font-size: 0.88rem; cursor: pointer;
    }
  </style>
</head>
<body>
<div class="qwk">

  <div class="qwk-topbar">
    <a href="jeuxdesociete.html">&#8592;</a>
    <h1>🎯 Qwirkle — Score</h1>
  </div>

  <div id="qwk-setup" class="qwk-setup">
    <div class="setup-lbl">Nombre de joueurs</div>
    <div class="nb-btns" id="qwk-nb-btns"></div>
    <div class="setup-lbl">Noms des joueurs</div>
    <div id="qwk-noms"></div>
    <button class="btn-start" onclick="demarrer()">Commencer ▶</button>
  </div>

  <div id="qwk-game" style="display:none;">
    <div class="qwk-grid" id="qwk-grid"></div>
    <button class="btn-new-game" onclick="reinitialiser()">🔄 Nouvelle partie</button>
  </div>

</div>

<script>
const COULEURS = ['#c9a84c','#5fb3ff','#c0392b','#27ae60','#9b59b6','#e67e22'];
let nbJ = 2, joueurs = [];

function initSetup() {
  const btns = document.getElementById('qwk-nb-btns');
  btns.innerHTML = '';
  [2,3,4].forEach(n => {
    const b = document.createElement('button');
    b.className = 'nb-btn' + (n === nbJ ? ' active' : '');
    b.textContent = n;
    b.onclick = () => {
      nbJ = n;
      btns.querySelectorAll('.nb-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      renderNoms();
    };
    btns.appendChild(b);
  });
  renderNoms();
}

function renderNoms() {
  const div = document.getElementById('qwk-noms');
  const vals = Array.from(div.querySelectorAll('input')).map(i => i.value);
  div.innerHTML = '';
  for (let i = 0; i < nbJ; i++) {
    const row = document.createElement('div');
    row.className = 'name-row';
    const num = document.createElement('div');
    num.className = 'name-num';
    num.style.cssText = `background:${COULEURS[i]}22;color:${COULEURS[i]}`;
    num.textContent = i + 1;
    const inp = document.createElement('input');
    inp.className = 'player-name-input'; inp.type = 'text';
    inp.placeholder = `Joueur ${i+1}`; inp.value = vals[i] || '';
    row.appendChild(num); row.appendChild(inp);
    div.appendChild(row);
  }
}

function demarrer() {
  const inputs = document.querySelectorAll('#qwk-noms input');
  joueurs = Array.from(inputs).map((inp, i) => ({
    nom: inp.value.trim() || `Joueur ${i+1}`,
    couleur: COULEURS[i],
    total: 0
  }));
  document.getElementById('qwk-setup').style.display = 'none';
  document.getElementById('qwk-game').style.display = '';
  renderCartes();
}

function renderCartes() {
  const grid = document.getElementById('qwk-grid');
  grid.innerHTML = '';
  const maxScore = Math.max(...joueurs.map(j => j.total));

  joueurs.forEach((j, i) => {
    const isLeader = j.total > 0 && j.total === maxScore;

    const card = document.createElement('div');
    card.className = 'qwk-card' + (isLeader ? ' leader' : '');
    card.id = `qwk-card-${i}`;

    const header = document.createElement('div');
    header.className = 'qwk-header';
    const nom = document.createElement('div');
    nom.className = 'qwk-nom';
    nom.style.color = j.couleur;
    nom.textContent = j.nom;
    header.appendChild(nom);
    if (isLeader) {
      const badge = document.createElement('span');
      badge.className = 'qwk-leader-badge';
      badge.textContent = '🏆';
      header.appendChild(badge);
    }

    const totalDiv = document.createElement('div');
    totalDiv.className = 'qwk-total';
    totalDiv.id = `qwk-total-${i}`;
    totalDiv.textContent = j.total;

    const addRow = document.createElement('div');
    addRow.className = 'qwk-add-row';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.inputMode = 'numeric';
    inp.className = 'qwk-pts-input'; inp.id = `qwk-inp-${i}`;
    inp.placeholder = 'pts ce tour';
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') ajouterPoints(i); });
    const btnAdd = document.createElement('button');
    btnAdd.className = 'qwk-btn-add'; btnAdd.textContent = '+';
    btnAdd.onclick = () => ajouterPoints(i);
    addRow.appendChild(inp); addRow.appendChild(btnAdd);

    const btnQ = document.createElement('button');
    btnQ.className = 'qwk-btn-qwirkle'; btnQ.id = `qwk-btn-q-${i}`;
    btnQ.textContent = '🎯 Qwirkle ! +6';
    btnQ.onclick = () => faireQwirkle(i);

    card.appendChild(header);
    card.appendChild(totalDiv);
    card.appendChild(addRow);
    card.appendChild(btnQ);
    grid.appendChild(card);
  });
}

function ajouterPoints(i) {
  const inp = document.getElementById(`qwk-inp-${i}`);
  const pts = parseInt(inp.value) || 0;
  if (pts <= 0) return;
  joueurs[i].total += pts;
  inp.value = '';
  mettreAJour();
}

function faireQwirkle(i) {
  joueurs[i].total += 6;
  const btn = document.getElementById(`qwk-btn-q-${i}`);
  btn.classList.remove('flash');
  void btn.offsetWidth;
  btn.classList.add('flash');
  mettreAJour();
}

function mettreAJour() {
  const maxScore = Math.max(...joueurs.map(j => j.total));
  joueurs.forEach((j, i) => {
    document.getElementById(`qwk-total-${i}`).textContent = j.total;
    const card = document.getElementById(`qwk-card-${i}`);
    const isLeader = j.total > 0 && j.total === maxScore;
    card.classList.toggle('leader', isLeader);
    const header = card.querySelector('.qwk-header');
    const existing = header.querySelector('.qwk-leader-badge');
    if (isLeader && !existing) {
      const badge = document.createElement('span');
      badge.className = 'qwk-leader-badge';
      badge.textContent = '🏆';
      header.appendChild(badge);
    } else if (!isLeader && existing) {
      existing.remove();
    }
  });
}

function reinitialiser() {
  if (!confirm('Commencer une nouvelle partie ?')) return;
  joueurs = [];
  document.getElementById('qwk-game').style.display = 'none';
  document.getElementById('qwk-setup').style.display = '';
  initSetup();
}

initSetup();
</script>

<div data-version-badge style="position:fixed;bottom:1rem;left:1rem;background:red;color:white;font-weight:bold;font-size:0.8rem;padding:0.3rem 0.6rem;border-radius:5px;z-index:9999;"></div>
<script src="version.js"></script>
</body>
</html>
