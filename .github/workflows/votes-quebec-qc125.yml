# Mise à jour quotidienne de la page Votes Québec (simulation loi 39) avec les projections Qc125.
# Télécharge les 127 fiches de circonscription de qc125.com, reconstruit data.json et pousse sur master
# (Hostinger déploie alors le site automatiquement). La date de vérification (votes-quebec/verif.json) est publiée
# chaque jour, même quand Qc125 n'a rien changé.
# Si une fiche Qc125 est illisible, rien n'est publié : le pipeline échoue et GitHub envoie un courriel.
name: Votes Québec · données Qc125

on:
  schedule:
    # GitHub retarde souvent les déclenchements programmés de plusieurs heures (ou en saute) : un essai
    # toutes les 3 heures. Un seul commit par jour au plus si Qc125 ne change rien (« déjà vérifié aujourd'hui »).
    - cron: "17 */3 * * *"
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write

concurrency:
  group: loi39-qc125
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Projections Qc125
        working-directory: votes-quebec/outils
        run: |
          for essai in 1 2 3; do
            python3 scrape_qc125.py && exit 0
            echo "Essai $essai échoué, nouvel essai dans 60 s"; sleep 60
          done
          exit 1

      - name: Sondages (Qc125) et résultat de l'élection 2026 (onglet « Votes Québec »)
        working-directory: votes-quebec/outils
        run: |
          # un échec ici ne bloque pas la simulation : on garde simplement les fichiers précédents
          python3 sondages.py || echo "::warning::Sondages Qc125 non mis à jour"
          python3 election.py || echo "::warning::Résultat de l'élection non mis à jour"
          # Votes France : sondages des prochaines législatives (tableau Wikipédia)
          (cd ../../votes-france/outils && python3 sondages_fr.py) || echo "::warning::Sondages France non mis à jour"
          (cd ../../votes-france/outils && python3 sondages_pres.py) || echo "::warning::Sondages présidentielle non mis à jour"
          (cd ../../votes-france/outils && python3 assemblee_fr.py) || echo "::warning::Assemblée nationale non mise à jour"
          # Votes Canada : sondages fédéraux et projection Qc125 (les 343 fiches ne sont relues que si Qc125 a publié une nouvelle projection)
          (cd ../../votes-canada/outils && python3 sondages_ca.py) || echo "::warning::Sondages fédéraux non mis à jour"
          (cd ../../votes-canada/outils && python3 canada.py) || echo "::warning::Projection fédérale Qc125 non mise à jour"

      - name: data.json, simulation de référence et page
        working-directory: votes-quebec/outils
        env:
          LOI39_AUTONOME: ${{ runner.temp }}/loi39-simulation.html
        run: |
          python3 build_data80.py
          python3 sim80.py
          python3 build_site.py

      - name: Publier la vérification (et les données si elles ont changé)
        run: |
          DONNEES="votes-canada/sondages.json votes-canada/projection.json votes-france/sondages.json votes-france/sondages-pres.json votes-france/assemblee.json votes-quebec/sondages.json votes-quebec/election-2026.json votes-quebec/verif.json votes-quebec/data.json votes-quebec/outils/data.json votes-quebec/outils/proj.json votes-quebec/outils/ridings.tsv votes-quebec/outils/maj.json votes-quebec/outils/result.json"
          # la page elle-même ne doit pas changer : seules les données sont publiées
          AUTRES=$(git status --porcelain --untracked-files=no | awk '{print $2}' | grep -vxF -f <(tr ' ' '\n' <<< "$DONNEES") || true)
          if [ -n "$AUTRES" ]; then echo "Fichiers de la page modifiés par la reconstruction, rien n'est publié :"; echo "$AUTRES"; exit 1; fi
          git add $DONNEES
          if git diff --cached --quiet; then echo "Déjà vérifié aujourd'hui, rien à publier."; exit 0; fi
          MAJ=$(python3 -c "import json;print(json.load(open('votes-quebec/outils/maj.json')).get('texte','?'))")
          VERIF=$(python3 -c "import json;print(json.load(open('votes-quebec/verif.json'))['texte'])")
          if git diff --cached --quiet -- votes-quebec/outils/proj.json; then
            MSG="Loi 39 : vérification Qc125 du $VERIF, aucun changement (projection du $MAJ)"
          else
            MSG="Loi 39 : projections Qc125 du $MAJ (mise à jour automatique)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MSG"
          for essai in 1 2 3 4; do
            git push origin HEAD:master && exit 0
            sleep $((2 ** essai)); git pull --rebase origin master
          done
          exit 1
