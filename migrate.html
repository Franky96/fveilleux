<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Migration Firebase → MySQL</title>
<script>
  // Sécurité : admin seulement
  if (!sessionStorage.getItem('loggedIn') || sessionStorage.getItem('userRole') !== 'admin') {
    window.location.href = sessionStorage.getItem('loggedIn') ? 'dashboard.html' : 'index.html';
  }
</script>
<style>
  body { background:#111; color:#ccc; font-family:monospace; padding:2rem; }
  h1 { color:#c0392b; }
  button { background:#1a3a1a; color:#80cc80; border:1px solid #3a6a3a; padding:0.7rem 1.5rem; font-size:1rem; border-radius:6px; cursor:pointer; margin-top:1rem; }
  button:hover { background:#3a6a3a; }
  button:disabled { opacity:0.4; cursor:default; }
  #log { margin-top:1.5rem; line-height:1.8; }
  .ok  { color:#27ae60; }
  .err { color:#e74c3c; }
  .inf { color:#3498db; }
  .warn{ color:#f39c12; }
</style>
</head>
<body>
<h1>Migration Firebase → MySQL</h1>
<p>Ce script lit les données dans Firestore et les copie dans la base MySQL Hostinger.</p>
<p style="color:#f39c12;">⚠️ À utiliser une seule fois. Supprime ce fichier après la migration.</p>
<button id="btn" onclick="migrer()">Lancer la migration</button>
<div id="log"></div>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSaYgjA5Uv_9RsoCt7sRTqo4ALT2dLDPc",
  authDomain: "outils-de-frank.firebaseapp.com",
  projectId: "outils-de-frank",
  storageBucket: "outils-de-frank.firebasestorage.app",
  messagingSenderId: "675563680392",
  appId: "1:675563680392:web:673ffb948b184b8f45e53d"
};

const fbApp = initializeApp(firebaseConfig);
const fbDb  = getFirestore(fbApp);

const DOCS = [
  { col: 'donnees',  id: 'aviation_global' },
  { col: 'donnees',  id: 'ena_global'      },
  { col: 'donnees',  id: 'films_global'    },
  { col: 'donnees',  id: 'liens_global'    },
  { col: 'donnees',  id: 'rona_global'     },
  { col: 'systeme',  id: 'config'          },
];

const log = document.getElementById('log');
function ligne(msg, cls = '') {
  const p = document.createElement('p');
  p.style.margin = '0.2rem 0';
  p.className = cls;
  p.textContent = msg;
  log.appendChild(p);
}

window.migrer = async function() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  log.innerHTML = '';

  for (const { col, id } of DOCS) {
    ligne(`⏳ Lecture Firebase : ${col}/${id}`, 'inf');
    try {
      const snap = await getDoc(doc(fbDb, col, id));
      if (!snap.exists()) {
        ligne(`  ⚠️  Document inexistant, ignoré.`, 'warn');
        continue;
      }
      const data = snap.data();
      ligne(`  ✅ Lu (${JSON.stringify(data).length} octets)`, 'ok');

      ligne(`  ⏳ Écriture MySQL : ${col}/${id}`, 'inf');
      const res  = await fetch('/api/data.php', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'set', col, id, data }),
      });
      const json = await res.json();
      if (!res.ok || json.error) throw new Error(json.error ?? 'Erreur PHP');
      ligne(`  ✅ Écrit dans MySQL`, 'ok');
    } catch (e) {
      ligne(`  ❌ Erreur : ${e.message}`, 'err');
    }
  }

  ligne('', '');
  ligne('✅ Migration terminée ! Tu peux supprimer le fichier migrate.html.', 'ok');
  btn.textContent = 'Terminé';
};
</script>
</body>
</html>
