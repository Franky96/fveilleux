<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>@view-transition{navigation:auto}@media (prefers-reduced-motion: reduce){@view-transition{navigation:none}}</style>
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
<script>
  const _p = JSON.parse(sessionStorage.getItem('userPermissions') || '[]');
  if (!sessionStorage.getItem('loggedIn')) location.href = 'index.html';
  else if (sessionStorage.getItem('userRole') !== 'admin' && !_p.includes('aec-avionique')) location.href = 'dashboard.html';
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outils de Frank — Documentation AEC Avionique</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=40bed6c7">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=239eda2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<link rel="stylesheet" href="categorie.css">
<style>
/* ---- Documentation AEC Avionique : même jetons et mêmes cartes que les pages de catégorie (categorie.css) ---- */
.wrap{max-width:1180px}
body.avec-barre .wrap{max-width:1400px}
.tete .em{font-size:28px}
.fil{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:18px 0 0;font-size:13.5px;color:var(--muted)}
.fil a{color:var(--muted);border-bottom:1px solid transparent}
.fil a:hover{color:var(--text);border-bottom-color:var(--line2)}
.fil .sep{color:var(--faint)}
.fil b{color:var(--text);font-weight:600}
.retour-aec{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%;padding:7px 14px 7px 10px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--c) 55%,var(--line2));background:color-mix(in srgb,var(--c) 20%,var(--panel2));color:var(--text)}
.retour-aec:hover{border-color:color-mix(in srgb,var(--c) 80%,var(--line2))}
.retour-aec .fleche{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-size:17px;font-weight:700;
  background:color-mix(in srgb,var(--c) 40%,var(--panel2))}
.retour-aec>span:last-child{min-width:0}
.retour-aec small{display:block;font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.retour-aec b{display:block;font-weight:600;font-size:14.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- accueil : une carte par étape ---- */
.reprendre{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-size:14px;color:var(--muted)}
.reprendre:hover{color:var(--text);border-color:color-mix(in srgb,var(--c-info) 60%,var(--line2))}
.etapes-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;margin-top:20px}
.etape-carte{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 90%,transparent);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
a.etape-carte:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c-info) 55%,var(--line));box-shadow:0 14px 30px rgba(0,0,0,.22)}
.etape-carte.avenir{opacity:.45;border-style:dashed}
.etape-num{width:56px;height:56px;display:grid;place-items:center;border-radius:14px;font:800 30px var(--f-display);
  background:color-mix(in srgb,var(--c-info) 20%,var(--panel2));border:1px solid color-mix(in srgb,var(--c-info) 40%,var(--line))}
.etape-corps{min-width:0}
.etape-corps b{display:block;font:700 22px/1.1 var(--f-display);margin-bottom:4px}
.etape-cours{display:flex;gap:7px;font-size:13.5px;line-height:1.35;color:var(--text);margin:2px 0}
.etape-cours i{font-style:normal;flex:none}
.etape-cours.avenir{color:var(--faint)}
.etape-corps small{display:block;margin-top:6px;font:500 11.5px var(--f-mono);color:var(--faint)}
.etape-carte .fl{color:var(--faint);font-size:22px}
/* ---- dans une étape : barre latérale + zone principale ---- */
.aec-cadre{display:grid;grid-template-columns:300px minmax(0,1fr);gap:26px;align-items:start;margin-top:16px}
.barre-aec{position:sticky;top:calc(var(--tb2-h,60px) + 12px);max-height:calc(100dvh - var(--tb2-h,60px) - 24px);overflow:auto;overscroll-behavior:contain;
  padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);scrollbar-width:thin}
.b-toutes{display:block;padding:4px 6px;font-size:13px;color:var(--muted)}
.b-toutes:hover{color:var(--text)}
.b-etapes{display:flex;gap:5px;margin:8px 2px 10px}
.b-etapes a,.b-etapes span{flex:1;display:grid;place-items:center;height:32px;border-radius:9px;border:1px solid var(--line2);font:700 16px var(--f-display);color:var(--muted);background:var(--panel2)}
.b-etapes a:hover{color:var(--text);border-color:color-mix(in srgb,var(--c-info) 55%,var(--line2))}
.b-etapes a.actif{color:var(--text);background:color-mix(in srgb,var(--c-info) 26%,var(--panel2));border-color:color-mix(in srgb,var(--c-info) 70%,var(--line2))}
.b-etapes .avenir{opacity:.4;border-style:dashed}
.b-tete{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);margin-bottom:8px}
.b-titre{flex:1;display:block;padding:4px 6px 8px;font:800 24px/1.1 var(--f-display)}
.b-tout{display:flex;gap:2px}
.b-tout button{width:28px;height:28px;padding:0;border:0;border-radius:7px;background:none;color:var(--faint);cursor:pointer;font-size:16px}
.b-tout button:hover{background:var(--panel2);color:var(--text)}
.b-titre.ici,.b-titre:hover{color:color-mix(in srgb,var(--c-info) 50%,var(--text))}
.b-bloc{margin-bottom:6px}
.b-cours{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px;color:var(--muted)}
.b-cours .em{width:34px;height:34px;flex:none;display:grid;place-items:center;font-size:17px;border-radius:9px;
  background:color-mix(in srgb,var(--c) 16%,var(--panel2));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.b-cours>span:last-child{min-width:0}
.b-cours small{display:block;font:500 11px var(--f-mono);color:var(--faint)}
.b-cours b{display:block;font-weight:600;font-size:14px;line-height:1.25;color:inherit}
a.b-cours:hover{background:var(--panel2);color:var(--text)}
.b-bloc.ouvert>.b-cours{color:var(--text);background:color-mix(in srgb,var(--c) 14%,var(--panel2))}
.b-cours.ici{box-shadow:inset 3px 0 0 color-mix(in srgb,var(--c) 80%,var(--text))}
.b-cours.avenir{opacity:.45;cursor:default}
.b-modules,.b-lecons{list-style:none;margin:0;padding:0}
/* plis : chevron à gauche de chaque cours et de chaque module (déplié par défaut) */
.b-ligne{display:flex;align-items:center;gap:2px}
.b-ligne>a{flex:1;min-width:0}
.pli{flex:none;width:26px;height:26px;display:grid;place-items:center;padding:0;border:0;border-radius:7px;background:none;color:var(--faint);cursor:pointer;font-size:13px}
.pli:hover{background:var(--panel2);color:var(--text)}
.pli span{display:inline-block;transition:transform .18s ease}
.pli-vide{cursor:default}   /* pas « .vide » : categorie.css lui donne une marge */
.plie>.b-ligne>.pli span{transform:rotate(-90deg)}
.b-bloc.plie>.b-modules,li.plie>.b-lecons{display:none}
@media (prefers-reduced-motion: reduce){.pli span{transition:none}}
.b-modules{margin:4px 0 8px 26px;padding-left:8px;border-left:1px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.b-mod{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:8px;font-size:13.5px;line-height:1.3;color:var(--muted)}
.b-mod .n,.b-lecons .n{flex:none;min-width:26px;font:600 12px var(--f-mono);color:var(--faint)}
.b-mod:hover,.b-lecons a:hover{background:var(--panel2);color:var(--text)}
.b-mod.dedans{color:var(--text);font-weight:600}
.b-mod.ici{background:color-mix(in srgb,var(--c) 20%,var(--panel2))}
.b-lecons{margin:2px 0 6px 46px}
.b-lecons a{display:flex;gap:6px;padding:5px 8px;border-radius:7px;font-size:13px;line-height:1.3;color:var(--muted)}
.b-lecons a.ici{background:color-mix(in srgb,var(--c) 20%,var(--panel2));color:var(--text);font-weight:600}
.principal{min-width:0}
.haut-aec{position:sticky;top:var(--tb2-h,60px);z-index:5;display:flex;align-items:center;gap:8px;padding:8px 0;margin-top:-8px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.haut-aec:not(:has(.retour-aec)):not(:has(.tiroir-btn:not([hidden]))){display:none}
.tiroir-btn{display:none;align-items:center;gap:8px;min-width:0;max-width:46%;padding:9px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-size:13.5px}
.tiroir-btn span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voile{display:none}
#retour-zone{min-width:0;flex:1;display:flex}
.principal .tete{margin-top:6px}
.attente{margin:22px 0;padding:28px 22px;border:1px dashed var(--line2);border-radius:16px;color:var(--muted);text-align:center;font-size:16px;
  background:color-mix(in srgb,var(--panel) 60%,transparent)}
.attente .etroit{display:none}
@media (max-width:900px){.attente .large{display:none}.attente .etroit{display:inline}.attente>span[aria-hidden]{display:inline-block;transform:rotate(90deg)}}
.cours-bloc h3 a:hover{color:color-mix(in srgb,var(--c) 55%,var(--text))}
.cours-bloc>header a.em{text-decoration:none}
.etape{margin-top:30px}
.etape>h2{display:flex;align-items:baseline;gap:10px;margin:0 0 2px;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.01em}
.etape>h2 small{font:500 13px var(--f-mono);color:var(--faint)}
.etape.avenir{opacity:.55}
.etape.avenir p{margin:4px 0 0;color:var(--muted);font-style:italic}
.cours-bloc{margin-top:18px;border:1px solid var(--line);border-radius:18px;padding:16px 16px 18px;
  background:color-mix(in srgb,var(--panel) 72%,transparent)}
.cours-bloc>header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cours-bloc>header .em{width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:22px;border-radius:12px;
  background:color-mix(in srgb,var(--c) 22%,var(--panel2));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line))}
.cours-bloc h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1}
.cours-bloc header small{display:block;color:var(--muted);font-size:13px}
.carte .num{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;font:700 18px var(--f-display);letter-spacing:.02em;
  background:color-mix(in srgb,var(--c) 16%,var(--panel2));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s ease,border-color .2s ease}
.carte:hover .num{transform:scale(1.1) rotate(-6deg);background:color-mix(in srgb,var(--c) 30%,var(--panel2));border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.carte .num.long{font-size:13px;letter-spacing:0}
.cours-bloc .carte .num.long{white-space:nowrap}
article.md a.ouvrir{display:inline-block;margin:-4px 0 10px;font-size:13.5px}
.carte .compte{font:500 11.5px var(--f-mono);color:var(--faint)}
.vide-mod{margin:18px 0;padding:22px;border:1px dashed var(--line2);border-radius:14px;color:var(--muted);text-align:center}
/* fond figé sur cette page (demande de Frank : lecture des cours) ; le texte des leçons sur un panneau opaque */
.fond::before{animation:none!important;transform:none!important}
article.md{min-width:0;max-width:900px;font-size:16px;line-height:1.7;padding:22px 30px 26px;border-radius:16px;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18)}
article.md>:first-child{margin-top:0}
article.md h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.1;margin:4px 0 16px}
article.md h2{font-family:var(--f-display);font-weight:700;font-size:25px;margin:30px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--line)}
article.md h3{font-size:18px;margin:24px 0 8px}
article.md h4{font-size:16px;margin:20px 0 6px;color:var(--muted)}
article.md a{color:color-mix(in srgb,var(--c) 55%,var(--text));text-decoration:underline;text-underline-offset:2px}
article.md img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
article.md video{display:block;width:100%;max-height:70vh;border-radius:12px;background:#000;margin:12px 0}
article.md pre{overflow:auto;padding:12px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font:13.5px/1.5 var(--f-mono)}
article.md code{font:.92em var(--f-mono);background:var(--panel2);padding:1px 5px;border-radius:5px}
article.md pre code{background:none;padding:0}
article.md blockquote{margin:14px 0;padding:8px 16px;border-left:3px solid color-mix(in srgb,var(--c) 60%,var(--line));background:var(--panel);border-radius:0 10px 10px 0;color:var(--muted)}
article.md .tableau{overflow:auto;margin:14px 0}
article.md table{border-collapse:collapse;min-width:50%;font-size:14.5px}
article.md th,article.md td{border:1px solid var(--line2);padding:6px 10px;text-align:left;vertical-align:top}
article.md th{background:var(--panel2)}
article.md h4.minute,article.md h5.minute{display:inline-block;margin:18px 0 4px;padding:3px 10px;border-radius:999px;font:600 13px var(--f-mono);color:var(--text);
  background:color-mix(in srgb,var(--c) 22%,var(--panel2));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line))}
article.md sub{display:block;margin:-4px 0 14px;font-size:12.5px;line-height:1.4;vertical-align:baseline;color:var(--faint)}   /* « Source : … » sous une activité Moodle */
article.md li:has(>input[type=checkbox]){list-style:none;margin-left:-1.1em}
article.md input[type=checkbox]{margin-right:6px;accent-color:var(--c-info)}
article.md hr{border:none;border-top:1px solid var(--line);margin:26px 0}
article.md .katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
article.md a.pdf::before{content:"📄 ";text-decoration:none;display:inline-block}
article.md a.fichier::before{content:"📎 ";text-decoration:none;display:inline-block}
.yt{position:relative;display:block;width:100%;max-width:720px;aspect-ratio:16/9;margin:12px 0;border-radius:12px;overflow:hidden;
  background:#000 center/cover no-repeat;border:1px solid var(--line);cursor:pointer;text-decoration:none!important}
.yt::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.65))}
.yt .jouer{position:absolute;left:50%;top:50%;width:68px;height:48px;margin:-24px 0 0 -34px;border-radius:14px;background:rgba(200,0,0,.88);
  display:grid;place-items:center;color:#fff;font-size:22px;transition:transform .2s}
.yt:hover .jouer{transform:scale(1.08)}
.yt .lib{position:absolute;left:12px;right:12px;bottom:9px;color:#fff;font-size:13.5px;text-shadow:0 1px 3px #000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-bloc{margin:12px 0 18px}
.yt-bloc .yt{margin:0 0 4px}
.yt.yt-joue{cursor:default}
.yt.yt-joue::before{display:none}
.yt-bloc a.ouvrir{font-size:13px;color:var(--muted)}
.nav-lecons{display:flex;justify-content:space-between;gap:12px;margin:34px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.nav-lecons a{display:flex;flex-direction:column;max-width:48%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.nav-lecons a:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.nav-lecons small{color:var(--faint);font-size:12px}
.nav-lecons .suiv{margin-left:auto;text-align:right}
.source{margin-top:6px;font-size:12.5px;color:var(--faint)}
.source a{color:var(--faint)}
.chargement{margin:40px 0;color:var(--muted);text-align:center}
@media (max-width:900px){   /* téléphone et tablette étroite : la barre devient un tiroir */
  .aec-cadre{grid-template-columns:1fr;gap:0}
  .barre-aec{position:fixed;z-index:50;left:0;top:var(--tb2-h,60px);bottom:0;width:min(88vw,340px);max-height:none;border-radius:0 16px 16px 0;
    transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 20px 50px rgba(0,0,0,.45)}
  body.tiroir-ouvert .barre-aec{transform:none}
  body.tiroir-ouvert .voile{display:block;position:fixed;inset:var(--tb2-h,60px) 0 0 0;z-index:49;background:rgba(0,0,0,.45)}
  .tiroir-btn{display:inline-flex}
  .haut-aec{display:flex!important}
  .retour-aec{flex:1}
}
@media (prefers-reduced-motion: reduce){.barre-aec{transition:none}}
@media (max-width:860px){
  article.md{padding:16px 14px 18px;border-radius:12px;margin-top:12px}
  article.md h1{font-size:28px}
}
</style>
<script src="topbar.js" defer></script>
</head>
<body data-retour="dashboard.html" data-retour-nom="Accueil" style="--c:var(--c-info)">
<div data-topbar><h1>Documentation AEC Avionique</h1></div>
<div class="fond" aria-hidden="true"></div>
<div class="wrap">
  <main id="vue"><p class="chargement">Chargement…</p></main>
  <footer class="pied">Archive personnelle des cours de l'AEC en avionique (ÉNA, Cégep Édouard-Montpetit).</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
