<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outils de Frank — Documentation AEC Avionique</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=40bed6c7">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=239eda2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<link rel="stylesheet" href="categorie.css">
<style>
/* ---- Documentation AEC Avionique : même jetons et mêmes cartes que les pages de catégorie (categorie.css) ---- */
.wrap{max-width:1180px}
.tete .em{font-size:28px}
.fil{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:18px 0 0;font-size:13.5px;color:var(--muted)}
.fil a{color:var(--muted);border-bottom:1px solid transparent}
.fil a:hover{color:var(--text);border-bottom-color:var(--line2)}
.fil .sep{color:var(--faint)}
.fil b{color:var(--text);font-weight:600}
/* ---- onglets : les étapes (6 à terme), puis les cours de l'étape ---- */
.onglets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:3px 2px;margin:22px 0 0;
  -webkit-mask:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.onglets::-webkit-scrollbar{display:none}
.onglet{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 16px;border-radius:12px;border:1px solid var(--line2);
  background:var(--panel);font:700 17px/1.1 var(--f-display);letter-spacing:.02em;color:var(--muted);transition:border-color .15s,background .15s,color .15s}
.onglet small{font:500 11px var(--f-mono);letter-spacing:0;color:var(--faint)}
a.onglet:hover{color:var(--text);border-color:color-mix(in srgb,var(--c-info) 55%,var(--line2))}
.onglet.actif{color:var(--text);background:color-mix(in srgb,var(--c-info) 24%,var(--panel2));border-color:color-mix(in srgb,var(--c-info) 70%,var(--line2))}
.onglet.avenir{opacity:.45;cursor:default;border-style:dashed}
.onglets.cours{margin-top:12px;gap:10px}
.onglet-cours{flex:none;display:flex;align-items:center;gap:10px;max-width:min(420px,82vw);padding:9px 14px 9px 10px;border-radius:14px;
  border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--muted);transition:border-color .15s,background .15s,color .15s}
.onglet-cours .em{width:36px;height:36px;flex:none;display:grid;place-items:center;font-size:18px;border-radius:10px;
  background:color-mix(in srgb,var(--c) 16%,var(--panel2));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.onglet-cours small{display:block;font:500 11px var(--f-mono);color:var(--faint)}
.onglet-cours b{display:block;font-weight:600;font-size:14.5px;line-height:1.25;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onglet-cours>span:last-child{min-width:0}
.onglet-cours:hover{color:var(--text);border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.onglet-cours.actif{color:var(--text);background:color-mix(in srgb,var(--c) 18%,var(--panel2));border-color:color-mix(in srgb,var(--c) 65%,var(--line))}
/* ---- boutons de retour, bien visibles, collés sous la barre du haut (demande de Frank) ---- */
.retours{position:sticky;top:var(--tb2-h,60px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;margin:0 calc(50% - 50vw);
  padding:10px max(18px,calc(50vw - 590px)) 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.retour-aec{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%;padding:7px 14px 7px 10px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--c) 55%,var(--line2));background:color-mix(in srgb,var(--c) 20%,var(--panel2));color:var(--text)}
.retour-aec:hover{border-color:color-mix(in srgb,var(--c) 80%,var(--line2))}
.retour-aec .fleche{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-size:17px;font-weight:700;
  background:color-mix(in srgb,var(--c) 40%,var(--panel2))}
.retour-aec>span:last-child{min-width:0}
.retour-aec small{display:block;font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.retour-aec b{display:block;font-weight:600;font-size:14.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.retour-aec.second{background:var(--panel);border-color:var(--line2)}
.retour-aec.second .fleche{background:var(--panel2)}
.retours+.tete,.retours+.lecon-zone{margin-top:16px}
.etape{margin-top:30px}
.etape>h2{display:flex;align-items:baseline;gap:10px;margin:0 0 2px;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.01em}
.etape>h2 small{font:500 13px var(--f-mono);color:var(--faint)}
.etape.avenir{opacity:.55}
.etape.avenir p{margin:4px 0 0;color:var(--muted);font-style:italic}
.cours-bloc{margin-top:18px;border:1px solid var(--line);border-radius:18px;padding:16px 16px 18px;
  background:color-mix(in srgb,var(--panel) 72%,transparent)}
.cours-bloc>header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cours-bloc>header .em{width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:22px;border-radius:12px;
  background:color-mix(in srgb,var(--c) 22%,var(--panel2));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line))}
.cours-bloc h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1}
.cours-bloc header small{display:block;color:var(--muted);font-size:13px}
.carte .num{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;font:700 18px var(--f-display);letter-spacing:.02em;
  background:color-mix(in srgb,var(--c) 16%,var(--panel2));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s ease,border-color .2s ease}
.carte:hover .num{transform:scale(1.1) rotate(-6deg);background:color-mix(in srgb,var(--c) 30%,var(--panel2));border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.carte .num.long{font-size:13px;letter-spacing:0}
.cours-bloc .carte .num.long{white-space:nowrap}
article.md a.ouvrir{display:inline-block;margin:-4px 0 10px;font-size:13.5px}
.carte .compte{font:500 11.5px var(--f-mono);color:var(--faint)}
.vide-mod{margin:18px 0;padding:22px;border:1px dashed var(--line2);border-radius:14px;color:var(--muted);text-align:center}
/* ---- leçon : liste du module à gauche, texte à droite ---- */
.lecon-zone{display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px;margin-top:18px;align-items:start}
.sommaire{position:sticky;top:calc(var(--tb2-h,60px) + 76px);max-height:calc(100dvh - var(--tb2-h,60px) - 94px);overflow:auto;
  border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--panel)}
.sommaire h4{margin:2px 6px 8px;font:700 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sommaire a{display:flex;gap:8px;padding:7px 8px;border-radius:8px;font-size:13.5px;line-height:1.35;color:var(--muted)}
.sommaire a:hover{background:var(--panel2);color:var(--text)}
.sommaire a.ici{background:color-mix(in srgb,var(--c) 18%,var(--panel2));color:var(--text);font-weight:600}
.sommaire a .n{flex:none;min-width:22px;font:500 12px/1.6 var(--f-mono);color:var(--faint)}
.sommaire .docs{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
details.sommaire-tel{display:none}
article.md{min-width:0;max-width:860px;font-size:16px;line-height:1.7}
article.md h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.1;margin:4px 0 16px}
article.md h2{font-family:var(--f-display);font-weight:700;font-size:25px;margin:30px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--line)}
article.md h3{font-size:18px;margin:24px 0 8px}
article.md h4{font-size:16px;margin:20px 0 6px;color:var(--muted)}
article.md a{color:color-mix(in srgb,var(--c) 55%,var(--text));text-decoration:underline;text-underline-offset:2px}
article.md img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
article.md video{display:block;width:100%;max-height:70vh;border-radius:12px;background:#000;margin:12px 0}
article.md pre{overflow:auto;padding:12px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font:13.5px/1.5 var(--f-mono)}
article.md code{font:.92em var(--f-mono);background:var(--panel2);padding:1px 5px;border-radius:5px}
article.md pre code{background:none;padding:0}
article.md blockquote{margin:14px 0;padding:8px 16px;border-left:3px solid color-mix(in srgb,var(--c) 60%,var(--line));background:var(--panel);border-radius:0 10px 10px 0;color:var(--muted)}
article.md .tableau{overflow:auto;margin:14px 0}
article.md table{border-collapse:collapse;min-width:50%;font-size:14.5px}
article.md th,article.md td{border:1px solid var(--line2);padding:6px 10px;text-align:left;vertical-align:top}
article.md th{background:var(--panel2)}
article.md hr{border:none;border-top:1px solid var(--line);margin:26px 0}
article.md .katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
article.md a.pdf::before{content:"📄 ";text-decoration:none;display:inline-block}
article.md a.fichier::before{content:"📎 ";text-decoration:none;display:inline-block}
.yt{position:relative;display:block;width:100%;max-width:720px;aspect-ratio:16/9;margin:12px 0;border-radius:12px;overflow:hidden;
  background:#000 center/cover no-repeat;border:1px solid var(--line);cursor:pointer;text-decoration:none!important}
.yt::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.65))}
.yt .jouer{position:absolute;left:50%;top:50%;width:68px;height:48px;margin:-24px 0 0 -34px;border-radius:14px;background:rgba(200,0,0,.88);
  display:grid;place-items:center;color:#fff;font-size:22px;transition:transform .2s}
.yt:hover .jouer{transform:scale(1.08)}
.yt .lib{position:absolute;left:12px;right:12px;bottom:9px;color:#fff;font-size:13.5px;text-shadow:0 1px 3px #000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.nav-lecons{display:flex;justify-content:space-between;gap:12px;margin:34px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.nav-lecons a{display:flex;flex-direction:column;max-width:48%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.nav-lecons a:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.nav-lecons small{color:var(--faint);font-size:12px}
.nav-lecons .suiv{margin-left:auto;text-align:right}
.source{margin-top:6px;font-size:12.5px;color:var(--faint)}
.source a{color:var(--faint)}
.chargement{margin:40px 0;color:var(--muted);text-align:center}
@media (max-width:640px){.retours{gap:6px;padding-top:8px;padding-bottom:8px}.retour-aec{padding:6px 10px 6px 8px}.retour-aec .fleche{width:26px;height:26px}.retour-aec.second{max-width:40%}.retour-aec:first-child{flex:1}}
@media (max-width:640px){   /* téléphone : les cours de l'étape empilés (2 ou 3), pas en défilement de côté */
  .onglets.cours{flex-direction:column;overflow:visible;-webkit-mask:none;mask:none;gap:8px}
  .onglet-cours{max-width:none}
  .onglet-cours b{white-space:normal}
}
@media (max-width:860px){
  .lecon-zone{grid-template-columns:1fr}
  .sommaire{display:none}
  details.sommaire-tel{display:block;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px 10px}
  details.sommaire-tel summary{cursor:pointer;font-weight:600;font-size:14px}
  details.sommaire-tel .sommaire{display:block;position:static;max-height:none;border:0;padding:6px 0 0;background:none}
  article.md h1{font-size:28px}
}
</style>
<script src="topbar.js" defer></script>
</head>
<body data-retour="dashboard.html" data-retour-nom="Accueil" style="--c:var(--c-info)">
<div data-topbar><h1>Documentation AEC Avionique</h1></div>

<div class="wrap">

  <footer class="pied">Archive personnelle des cours de l'AEC en avionique (ÉNA, Cégep Édouard-Montpetit).</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
