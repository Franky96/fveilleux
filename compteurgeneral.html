<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteur Général — Score</title>
  <link rel="stylesheet" href="style.css">
  <script>
    const _pCG = JSON.parse(sessionStorage.getItem('userPermissions') || '[]');
    if (!sessionStorage.getItem('loggedIn') ||
        (!_pCG.includes('jeuxdesociete') && !_pCG.includes('compteurgeneral') && sessionStorage.getItem('userRole') !== 'admin')) {
      window.location.href = 'dashboard.html';
    }
  </script>
  <style>
    body { align-items: flex-start; }
    .cg { width: 100%; padding-bottom: 2rem; }

    :root { --score-size: 5.5rem; }

    .cg-topbar {
      position: sticky; top: 0; z-index: 100;
      background: #080f12; border-bottom: 1px solid #1a3a4a;
      padding: 0.6rem 1rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .cg-topbar a { color: #20b8c8; text-decoration: none; font-size: 1.3rem; }
    .cg-topbar h1 { font-size: 1rem; color: #e0f0f4; margin: 0; flex: 1; }

    .cg-slider-bar {
      position: sticky; top: 2.75rem; z-index: 99;
      background: #080f12; border-bottom: 1px solid #1a2e38;
      padding: 0.35rem 1rem;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .cg-slider-bar span { font-size: 0.65rem; color: #3a6a78; white-space: nowrap; }
    .cg-slider {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 4px; border-radius: 2px;
      background: linear-gradient(to right, #1a7a8a var(--slider-pct, 50%), #1a2e38 var(--slider-pct, 50%));
      outline: none; cursor: pointer;
    }
    .cg-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: #20b8c8; cursor: pointer;
    }
    .cg-slider::-moz-range-thumb {
      width: 16px; height: 16px; border: none;
      border-radius: 50%; background: #20b8c8; cursor: pointer;
    }
    .cg-slider-val { font-size: 0.7rem; color: #3a8a9a; font-weight: bold; min-width: 2.5rem; text-align: right; }

    /* Setup */
    .cg-setup { padding: 1.25rem; max-width: 430px; margin: 0 auto; }
    .setup-lbl { font-size: 0.72rem; color: #3a6a78; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .nb-btns { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .nb-btn {
      width: 2.6rem; height: 2.6rem; border-radius: 50%;
      border: 2px solid #1a3a4a; background: transparent;
      color: #3a6a78; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.15s;
    }
    .nb-btn.active { border-color: #20b8c8; color: #20b8c8; background: rgba(32,184,200,0.1); }
    .name-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
    .name-num {
      width: 1.7rem; height: 1.7rem; border-radius: 50%; flex-shrink: 0;
      font-size: 0.75rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
    }
    .player-name-input {
      flex: 1; padding: 0.6rem 0.75rem;
      background: #080f12; border: 1px solid #1a3a4a; border-radius: 8px;
      color: #e0f0f4; font-size: 0.95rem; margin: 0;
    }
    .player-name-input:focus { border-color: #20b8c8; outline: none; }

    /* Mode + cible */
    .mode-btns { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .mode-btn {
      flex: 1; padding: 0.65rem 0.5rem; border-radius: 10px; cursor: pointer;
      background: transparent; border: 1.5px solid #1a3a4a;
      color: #3a6a78; font-size: 0.9rem; font-weight: bold;
      display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
      transition: all 0.15s;
    }
    .mode-btn small { font-size: 0.7rem; font-weight: normal; color: #2a5060; line-height: 1.3; text-align: center; }
    .mode-btn.active { border-color: #20b8c8; color: #20b8c8; background: rgba(32,184,200,0.08); }
    .mode-btn.active small { color: #1a7a8a; }

    .cg-target-input {
      width: 9rem; padding: 0.6rem 0.75rem; text-align: center;
      background: #080f12; border: 1px solid #1a3a4a; border-radius: 8px;
      color: #e0f0f4; font-size: 1.1rem; font-weight: bold; margin: 0 0 1.25rem 0;
    }
    .cg-target-input:focus { border-color: #20b8c8; outline: none; }
    .cg-target-input::-webkit-inner-spin-button,
    .cg-target-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .cg-target-input { -moz-appearance: textfield; }

    .btn-start {
      display: block; width: 100%; margin-top: 0.5rem;
      padding: 0.9rem; background: #1a5a6a; color: #e0f0f4;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer;
    }

    /* Table */
    .score-outer { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .cg-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .cg-table th, .cg-table td { min-width: 120px; }

    .cg-table thead th {
      padding: 0.85rem 0.5rem;
      font-size: 1.3rem; font-weight: bold; text-align: center;
      background: #080f12; border-bottom: 2px solid #1a3a4a;
    }
    .cg-table tbody td {
      padding: 0.5rem 0.5rem; text-align: center;
      border-bottom: 1px solid #0f1c22; background: #060d10;
    }

    .cg-total-cell {
      font-size: var(--score-size); font-weight: bold; color: #e0f0f4;
      padding: 0.4rem 0.5rem !important; line-height: 1;
    }
    .cg-total-cell.leader { color: #c9a84c; }
    .cg-total-cell.winner { color: #20b8c8; }

    .cg-bar-cell { padding: 0.2rem 0.6rem !important; }
    .cg-bar-bg { background: #0f1c22; border-radius: 4px; height: 5px; overflow: hidden; }
    .cg-bar-fill { height: 100%; background: #1a5a6a; border-radius: 4px; transition: width 0.3s; }
    .cg-bar-fill.leader { background: #c9a84c; }
    .cg-bar-fill.winner { background: #20b8c8; }
    /* En mode MIN la barre = danger (ne pas vouloir remplir) */
    .mode-min .cg-bar-fill { background: #6a3a1a; }
    .mode-min .cg-bar-fill.leader { background: #20b8c8; }
    .mode-min .cg-bar-fill.busted { background: #c0392b; }

    .cg-pts-input {
      width: 100%; max-width: 7rem; text-align: center;
      padding: 0.65rem 0.3rem;
      background: #080f12; border: 1px solid #1a3a4a;
      border-radius: 10px; color: #e0f0f4; font-size: 1.1rem; font-weight: bold; margin: 0;
      box-sizing: border-box;
    }
    .cg-pts-input:focus { border-color: #20b8c8; outline: none; }
    .cg-pts-input::-webkit-inner-spin-button,
    .cg-pts-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .cg-pts-input { -moz-appearance: textfield; }

    .cg-btn-cell { display: flex; align-items: center; justify-content: center; gap: 0.4rem; }
    .cg-btn-undo {
      width: 3rem; height: 3rem; background: transparent; border: 1px solid #1a3a4a;
      border-radius: 10px; color: #3a6a78; font-size: 1.2rem;
      cursor: pointer; margin: 0; padding: 0;
      display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s;
    }
    .cg-btn-undo:not(:disabled):hover { border-color: #20b8c8; color: #20b8c8; }
    .cg-btn-undo:disabled { opacity: 0.25; cursor: default; }
    .cg-btn-minus {
      width: 3rem; height: 3rem;
      background: rgba(192,57,43,0.08); border: 1px solid #c0392b;
      border-radius: 10px; color: #e05050; font-size: 1.5rem;
      font-weight: bold; cursor: pointer; margin: 0; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .cg-btn-plus {
      width: 3rem; height: 3rem;
      background: rgba(32,184,200,0.08); border: 1px solid #20b8c8;
      border-radius: 10px; color: #20b8c8; font-size: 1.5rem;
      font-weight: bold; cursor: pointer; margin: 0; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }

    .cg-table tbody tr:last-child td { border-bottom: none; padding-bottom: 1rem; }
    .btn-new-game {
      display: block; width: calc(100% - 2rem); margin: 0.75rem 1rem 0;
      padding: 0.65rem; background: transparent;
      border: 1px solid #1a3a4a; border-radius: 10px;
      color: #3a6a78; font-size: 0.88rem; cursor: pointer;
    }
  </style>
</head>
<body>
<div class="cg" id="cg-root">

  <div class="cg-topbar">
    <a href="jeuxdesociete.html">&#8592;</a>
    <h1 id="cg-title">🎯 Compteur Général</h1>
  </div>

  <div class="cg-slider-bar" id="cg-slider-bar" style="display:none;">
    <span>A</span>
    <input type="range" class="cg-slider" id="cg-slider" min="2" max="20" step="0.5" value="5.5">
    <span style="font-size:1rem;">A</span>
    <span class="cg-slider-val" id="cg-slider-val">5.5</span>
  </div>

  <div id="cg-setup" class="cg-setup">
    <div class="setup-lbl">Nombre de joueurs</div>
    <div class="nb-btns" id="cg-nb-btns"></div>

    <div class="setup-lbl">Noms des joueurs</div>
    <div id="cg-noms"></div>

    <div class="setup-lbl" style="margin-top:1rem;">Condition de victoire</div>
    <div class="mode-btns" id="cg-mode-btns">
      <button class="mode-btn active" data-mode="max" onclick="setMode('max')">
        ↑ Maximum
        <small>Premier à atteindre X pts gagne</small>
      </button>
      <button class="mode-btn" data-mode="min" onclick="setMode('min')">
        ↓ Minimum
        <small>Fin quand X est atteint, le moins de points gagne</small>
      </button>
    </div>

    <div class="setup-lbl">Cible de points</div>
    <input type="text" inputmode="numeric" class="cg-target-input" id="cg-target" value="100">

    <button class="btn-start" onclick="demarrer()">Commencer ▶</button>
  </div>

  <div id="cg-game" style="display:none;">
    <div class="score-outer">
      <table class="cg-table" id="cg-table"></table>
    </div>
    <button class="btn-new-game" onclick="reinitialiser()">🔄 Nouvelle partie</button>
  </div>

</div>
<script>
const COULEURS = ['#a088ff','#ff7070','#50d0a0','#f1c40f','#5fb3ff','#ff9f43'];
let nbJ = 2, joueurs = [], mode = 'max', CIBLE = 100;

// Slider taille des scores
(function() {
  const slider = document.getElementById('cg-slider');
  const val    = document.getElementById('cg-slider-val');
  const root   = document.documentElement;
  const MIN = 2, MAX = 20;
  function applySize(v) {
    root.style.setProperty('--score-size', v + 'rem');
    val.textContent = v;
    const pct = ((v - MIN) / (MAX - MIN) * 100).toFixed(1) + '%';
    slider.style.setProperty('--slider-pct', pct);
  }
  slider.addEventListener('input', () => applySize(parseFloat(slider.value)));
  applySize(parseFloat(slider.value));
})();

function setMode(m) {
  mode = m;
  document.querySelectorAll('#cg-mode-btns .mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === m);
  });
}

function initSetup() {
  const btns = document.getElementById('cg-nb-btns');
  btns.innerHTML = '';
  [2,3,4,5,6].forEach(n => {
    const b = document.createElement('button');
    b.className = 'nb-btn' + (n === nbJ ? ' active' : '');
    b.textContent = n;
    b.onclick = () => {
      nbJ = n;
      btns.querySelectorAll('.nb-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      renderNoms();
    };
    btns.appendChild(b);
  });
  renderNoms();
}

function renderNoms() {
  const div = document.getElementById('cg-noms');
  const vals = Array.from(div.querySelectorAll('input')).map(i => i.value);
  div.innerHTML = '';
  for (let i = 0; i < nbJ; i++) {
    const row = document.createElement('div');
    row.className = 'name-row';
    const num = document.createElement('div');
    num.className = 'name-num';
    num.style.cssText = `background:${COULEURS[i]}22;color:${COULEURS[i]}`;
    num.textContent = i + 1;
    const inp = document.createElement('input');
    inp.className = 'player-name-input'; inp.type = 'text';
    inp.placeholder = `Joueur ${i+1}`; inp.value = vals[i] || '';
    row.appendChild(num); row.appendChild(inp);
    div.appendChild(row);
  }
}

function demarrer() {
  CIBLE = parseInt(document.getElementById('cg-target').value) || 100;
  const inputs = document.querySelectorAll('#cg-noms input');
  joueurs = Array.from(inputs).map((inp, i) => ({
    nom: inp.value.trim() || `Joueur ${i+1}`,
    couleur: COULEURS[i],
    total: 0,
    history: [],
  }));
  document.getElementById('cg-setup').style.display = 'none';
  document.getElementById('cg-game').style.display = '';
  document.getElementById('cg-slider-bar').style.display = '';
  document.getElementById('cg-title').textContent =
    (mode === 'max' ? '🏆' : '🥅') + ' Compteur — Cible : ' + CIBLE;
  const root = document.getElementById('cg-root');
  root.classList.toggle('mode-min', mode === 'min');
  root.classList.toggle('mode-max', mode === 'max');
  renderTableau();
}

function renderTableau() {
  const table = document.getElementById('cg-table');
  table.innerHTML = '';

  // En-têtes
  const thead = document.createElement('thead');
  const trHead = document.createElement('tr');
  joueurs.forEach((j, i) => {
    const th = document.createElement('th');
    th.style.color = j.couleur; th.textContent = j.nom; th.id = `cg-th-${i}`;
    trHead.appendChild(th);
  });
  thead.appendChild(trHead); table.appendChild(thead);

  const tbody = document.createElement('tbody');

  // Totaux
  const trTotal = document.createElement('tr');
  joueurs.forEach((j, i) => {
    const td = document.createElement('td');
    td.className = 'cg-total-cell'; td.id = `cg-total-${i}`; td.textContent = j.total;
    trTotal.appendChild(td);
  });
  tbody.appendChild(trTotal);

  // Barre de progression
  const trBar = document.createElement('tr');
  joueurs.forEach((j, i) => {
    const td = document.createElement('td'); td.className = 'cg-bar-cell';
    const bg = document.createElement('div'); bg.className = 'cg-bar-bg';
    const fill = document.createElement('div'); fill.className = 'cg-bar-fill'; fill.id = `cg-bar-${i}`;
    fill.style.width = Math.min(100, Math.max(0, Math.round(j.total / CIBLE * 100))) + '%';
    bg.appendChild(fill); td.appendChild(bg); trBar.appendChild(td);
  });
  tbody.appendChild(trBar);

  // Input
  const trInput = document.createElement('tr');
  joueurs.forEach((j, i) => {
    const td = document.createElement('td');
    const inp = document.createElement('input');
    inp.type = 'text'; inp.inputMode = 'numeric';
    inp.className = 'cg-pts-input'; inp.id = `cg-inp-${i}`;
    inp.placeholder = 'pts';
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') ajouterPoints(i, 1); });
    td.appendChild(inp); trInput.appendChild(td);
  });
  tbody.appendChild(trInput);

  // Boutons Undo / − / +
  const trBtns = document.createElement('tr');
  joueurs.forEach((j, i) => {
    const td = document.createElement('td');
    const cell = document.createElement('div'); cell.className = 'cg-btn-cell';

    const undo = document.createElement('button');
    undo.className = 'cg-btn-undo'; undo.id = `cg-undo-${i}`;
    undo.textContent = '↩'; undo.disabled = true;
    undo.onclick = () => annuler(i);

    const minus = document.createElement('button');
    minus.className = 'cg-btn-minus'; minus.textContent = '−';
    minus.onclick = () => ajouterPoints(i, -1);

    const plus = document.createElement('button');
    plus.className = 'cg-btn-plus'; plus.textContent = '+';
    plus.onclick = () => ajouterPoints(i, 1);

    cell.appendChild(undo); cell.appendChild(minus); cell.appendChild(plus);
    td.appendChild(cell); trBtns.appendChild(td);
  });
  tbody.appendChild(trBtns);

  table.appendChild(tbody);
  mettreAJour();
}

function ajouterPoints(i, signe) {
  const inp = document.getElementById(`cg-inp-${i}`);
  const val = parseInt(inp.value) || 0;
  if (val <= 0) return;
  joueurs[i].history.push(signe * val);
  joueurs[i].total += signe * val;
  inp.value = '';
  mettreAJour();
}

function annuler(i) {
  if (!joueurs[i].history.length) return;
  joueurs[i].total -= joueurs[i].history.pop();
  mettreAJour();
}

function mettreAJour() {
  const scores = joueurs.map(j => j.total);
  const maxScore = Math.max(...scores);
  const minScore = Math.min(...scores);
  const gameOver = joueurs.some(j => j.total >= CIBLE);

  joueurs.forEach((j, i) => {
    let isWinner = false, isLeader = false, isBusted = false;

    if (mode === 'max') {
      isWinner = j.total >= CIBLE;
      isLeader = !gameOver && j.total > 0 && j.total === maxScore;
    } else {
      isBusted = j.total >= CIBLE;
      if (gameOver) {
        isWinner = j.total === minScore;
      } else {
        isLeader = j.total === minScore && scores.some(s => s > 0);
      }
    }

    const cell = document.getElementById(`cg-total-${i}`);
    cell.textContent = j.total;
    cell.classList.toggle('winner', isWinner);
    cell.classList.toggle('leader', isLeader && !isWinner);

    const th = document.getElementById(`cg-th-${i}`);
    if (th) th.textContent = j.nom + (isWinner ? ' 🏆' : isLeader ? ' 👑' : '');

    const undo = document.getElementById(`cg-undo-${i}`);
    if (undo) undo.disabled = j.history.length === 0;

    const bar = document.getElementById(`cg-bar-${i}`);
    if (bar) {
      bar.style.width = Math.min(100, Math.max(0, Math.round(j.total / CIBLE * 100))) + '%';
      bar.classList.toggle('winner', isWinner);
      bar.classList.toggle('leader', isLeader && !isWinner);
      bar.classList.toggle('busted', isBusted);
    }
  });
}

function reinitialiser() {
  if (!confirm('Commencer une nouvelle partie ?')) return;
  joueurs = [];
  document.getElementById('cg-game').style.display = 'none';
  document.getElementById('cg-slider-bar').style.display = 'none';
  document.getElementById('cg-setup').style.display = '';
  document.getElementById('cg-title').textContent = '🎯 Compteur Général';
  const root = document.getElementById('cg-root');
  root.classList.remove('mode-min', 'mode-max');
  initSetup();
}

initSetup();
</script>

<div data-version-badge style="position:fixed;bottom:1rem;left:1rem;background:red;color:white;font-weight:bold;font-size:0.8rem;padding:0.3rem 0.6rem;border-radius:5px;z-index:9999;"></div>
<script src="version.js"></script>
</body>
</html>
