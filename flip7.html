<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip 7 — Score</title>
  <link rel="stylesheet" href="style.css">
  <script>
    const _pF7 = JSON.parse(sessionStorage.getItem('userPermissions') || '[]');
    if (!sessionStorage.getItem('loggedIn') ||
        (!_pF7.includes('jeuxdesociete') && sessionStorage.getItem('userRole') !== 'admin')) {
      window.location.href = 'dashboard.html';
    }
  </script>
  <style>
    body { align-items: flex-start; }
    .f7 { width: 100%; padding-bottom: 2rem; }

    .f7-topbar {
      position: sticky; top: 0; z-index: 100;
      background: #0f0f1a; border-bottom: 1px solid #2a2a3a;
      padding: 0.6rem 1rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .f7-topbar a { color: #a088ff; text-decoration: none; font-size: 1.3rem; }
    .f7-topbar h1 { font-size: 1rem; color: #f0ede6; margin: 0; flex: 1; }

    /* Setup */
    .f7-setup { padding: 1.25rem; max-width: 400px; margin: 0 auto; }
    .setup-lbl { font-size: 0.72rem; color: #5a556a; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; margin-top: 1rem; }
    .nb-btns { display: flex; gap: 0.5rem; margin-bottom: 0.25rem; }
    .nb-btn {
      width: 2.6rem; height: 2.6rem; border-radius: 50%;
      border: 2px solid #2a2a3a; background: transparent;
      color: #5a556a; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.15s;
    }
    .nb-btn.active { border-color: #7c5cbf; color: #a088ff; background: rgba(160,136,255,0.1); }
    .name-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
    .name-num {
      width: 1.7rem; height: 1.7rem; border-radius: 50%; flex-shrink: 0;
      font-size: 0.75rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
    }
    .player-name-input {
      flex: 1; padding: 0.6rem 0.75rem;
      background: #0f0f1a; border: 1px solid #2a2a3a; border-radius: 8px;
      color: #f0ede6; font-size: 0.95rem; margin: 0;
    }
    .player-name-input:focus { border-color: #a088ff; outline: none; }
    .target-row { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.25rem; }
    .target-input {
      width: 5rem; text-align: center; padding: 0.6rem 0.5rem;
      background: #0f0f1a; border: 1px solid #2a2a3a; border-radius: 8px;
      color: #f0ede6; font-size: 1rem; font-weight: bold; margin: 0;
    }
    .target-input:focus { border-color: #a088ff; outline: none; }
    .target-input::-webkit-inner-spin-button,
    .target-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .target-input { -moz-appearance: textfield; }
    .target-hint { font-size: 0.8rem; color: #5a556a; }
    .btn-start {
      display: block; width: 100%; margin-top: 1.25rem;
      padding: 0.9rem; background: #7c5cbf; color: #fff;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer;
    }

    /* Table */
    .score-outer { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .f7-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .f7-table th, .f7-table td { min-width: 130px; }
    .f7-table thead th {
      padding: 0.85rem 0.5rem; font-size: 1.3rem; font-weight: bold; text-align: center;
      background: #0f0f1a; border-bottom: 2px solid #2a2a3a;
    }
    .f7-table tbody td {
      padding: 0.4rem 0.3rem; text-align: center;
      border-bottom: 1px solid #1a1a2a; background: #0a0a0f;
    }

    /* Total */
    .f7-total-cell {
      font-size: 3.5rem; font-weight: bold; color: #f0ede6;
      padding: 0.5rem 0.3rem !important;
    }
    .f7-total-cell.leader { color: #a088ff; }
    .f7-total-cell.winner { color: #f1c40f; }

    /* Progress bar */
    .f7-bar-cell { padding: 0.3rem 0.6rem !important; }
    .f7-bar-bg { background: #1a1a2a; border-radius: 4px; height: 6px; overflow: hidden; }
    .f7-bar-fill { height: 100%; background: #7c5cbf; border-radius: 4px; transition: width 0.3s; }
    .f7-bar-fill.leader { background: #a088ff; }
    .f7-bar-fill.winner { background: #f1c40f; }

    /* Round label */
    .f7-round-row td {
      padding: 0.3rem 0.5rem 0.2rem !important;
      background: #080810 !important;
      font-size: 0.65rem; color: #3a3550; font-weight: bold;
      letter-spacing: 0.08em; text-transform: uppercase;
      border-bottom: 1px solid #1a1a2a !important;
    }

    /* Action row */
    .f7-action-cell { display: flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.5rem 0.3rem !important; }
    .f7-btn-undo {
      width: 2.8rem; height: 2.8rem; background: transparent; border: 1px solid #2a2a3a;
      border-radius: 10px; color: #5a556a; font-size: 1.2rem;
      cursor: pointer; margin: 0; padding: 0;
      display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s;
      flex-shrink: 0;
    }
    .f7-btn-undo:not(:disabled):hover { border-color: #c0392b; color: #c0392b; }
    .f7-btn-undo:disabled { opacity: 0.25; cursor: default; }
    .f7-btn-score {
      flex: 1; padding: 0.65rem 0.3rem;
      background: rgba(124,92,191,0.15); border: 1px solid #7c5cbf;
      border-radius: 10px; color: #a088ff;
      font-size: 0.82rem; font-weight: bold; cursor: pointer;
      transition: background 0.1s;
    }
    .f7-btn-score:active { background: rgba(124,92,191,0.3); }

    .f7-table tbody tr:last-child td { border-bottom: none; padding-bottom: 1rem; }
    .btn-new-game {
      display: block; width: calc(100% - 2rem); margin: 0.75rem 1rem 0;
      padding: 0.65rem; background: transparent;
      border: 1px solid #2a2a3a; border-radius: 10px;
      color: #5a556a; font-size: 0.88rem; cursor: pointer;
    }

    /* ── Modal ── */
    .f7-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 200; display: flex; align-items: flex-end; justify-content: center;
    }
    .f7-modal {
      background: #0f0f1a; border: 1px solid #2a2a3a;
      border-radius: 20px 20px 0 0;
      width: 100%; max-width: 520px;
      padding: 1.25rem 1rem 2rem;
      max-height: 92vh; overflow-y: auto;
    }
    .f7-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .f7-modal-name { font-size: 1.1rem; font-weight: bold; }
    .f7-modal-close {
      width: 2rem; height: 2rem; border-radius: 50%;
      border: 1px solid #2a2a3a; background: transparent;
      color: #5a556a; font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* Total affiché dans le modal */
    .f7-modal-total {
      font-size: 3rem; font-weight: bold; text-align: center;
      margin: 0.5rem 0 1rem; line-height: 1;
    }
    .f7-modal-total-lbl {
      font-size: 0.65rem; color: #5a556a; letter-spacing: 0.1em;
      text-transform: uppercase; text-align: center; margin-bottom: 1rem;
    }

    /* Section labels dans le modal */
    .f7-modal-section-lbl {
      font-size: 0.65rem; color: #5a556a; letter-spacing: 0.1em;
      text-transform: uppercase; margin: 1rem 0 0.5rem;
    }

    /* Grille de cartes numérotées */
    .f7-cards-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem;
    }
    .f7-card-btn {
      aspect-ratio: 3/4; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border-radius: 8px; border: 2px solid #2a2a3a;
      background: #0a0a0f; cursor: pointer; gap: 0.05rem;
      transition: all 0.1s; -webkit-tap-highlight-color: transparent;
    }
    .f7-card-btn .card-num { font-size: 1.3rem; font-weight: bold; color: #f0ede6; line-height: 1; }
    .f7-card-btn .card-pts { font-size: 0.58rem; color: #5a556a; font-weight: bold; }
    .f7-card-btn.selected { border-width: 2px; background: rgba(124,92,191,0.15); }
    .f7-card-btn.selected .card-num { color: #a088ff; }
    .f7-card-btn.selected .card-pts { color: #7c5cbf; }

    /* Cartes spéciales */
    .f7-special-row {
      display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem;
    }
    .f7-special-btn {
      flex: 1; padding: 0.6rem 0.4rem;
      border-radius: 10px; border: 2px solid #2a2a3a;
      background: #0a0a0f; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.5rem; transition: all 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .f7-special-btn .sp-icon { font-size: 1.4rem; flex-shrink: 0; }
    .f7-special-btn .sp-info { text-align: left; flex: 1; }
    .f7-special-btn .sp-name { font-size: 0.8rem; font-weight: bold; color: #a89f94; line-height: 1.2; }
    .f7-special-btn .sp-effect { font-size: 0.62rem; color: #5a556a; }
    .f7-counter { display: flex; align-items: center; gap: 0.3rem; flex-shrink: 0; }
    .f7-counter-btn {
      width: 1.8rem; height: 1.8rem; border-radius: 6px;
      border: 1px solid #2a2a3a; background: transparent;
      color: #5a556a; font-size: 1rem; font-weight: bold;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      padding: 0; margin: 0;
    }
    .f7-counter-val { font-size: 1rem; font-weight: bold; color: #f0ede6; min-width: 1.2rem; text-align: center; }

    /* Flip 7 toggle */
    .f7-flip7-btn {
      width: 100%; padding: 0.75rem;
      border-radius: 10px; border: 2px solid #2a2a3a;
      background: #0a0a0f; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      font-size: 0.9rem; font-weight: bold; color: #5a556a;
      transition: all 0.1s; -webkit-tap-highlight-color: transparent;
      margin-bottom: 1.25rem;
    }
    .f7-flip7-btn.active {
      border-color: #f1c40f; background: rgba(241,196,15,0.08); color: #f1c40f;
    }
    .f7-flip7-badge { font-size: 1.1rem; }

    /* Boutons du modal */
    .f7-modal-btns { display: flex; gap: 0.5rem; }
    .f7-btn-cancel {
      flex: 0 0 auto; padding: 0.85rem 1rem;
      border-radius: 10px; border: 1px solid #2a2a3a;
      background: transparent; color: #5a556a;
      font-size: 0.9rem; cursor: pointer;
    }
    .f7-btn-confirm {
      flex: 1; padding: 0.85rem;
      border-radius: 10px; border: none;
      background: #7c5cbf; color: #fff;
      font-size: 1rem; font-weight: bold; cursor: pointer;
    }
    .f7-btn-confirm:disabled { opacity: 0.3; cursor: default; }
  </style>
</head>
<body>
<div class="f7">

  <div class="f7-topbar">
    <a href="jeuxdesociete.html">&#8592;</a>
    <h1>🃏 Flip 7 — Score</h1>
  </div>

  <div id="f7-setup" class="f7-setup">
    <div class="setup-lbl">Nombre de joueurs</div>
    <div class="nb-btns" id="f7-nb-btns"></div>
    <div class="setup-lbl">Noms des joueurs</div>
    <div id="f7-noms"></div>
    <div class="setup-lbl">Score cible</div>
    <div class="target-row">
      <input type="text" inputmode="numeric" id="f7-target" class="target-input" value="200">
      <span class="target-hint">points pour gagner</span>
    </div>
    <button class="btn-start" onclick="demarrer()">Commencer ▶</button>
  </div>

  <div id="f7-game" style="display:none;">
    <div class="score-outer">
      <table class="f7-table" id="f7-table"></table>
    </div>
    <button class="btn-new-game" onclick="reinitialiser()">🔄 Nouvelle partie</button>
  </div>

</div>

<!-- Modal de sélection des cartes -->
<div id="f7-overlay" class="f7-overlay" style="display:none;" onclick="overlayClick(event)">
  <div class="f7-modal" id="f7-modal">
    <div class="f7-modal-header">
      <div class="f7-modal-name" id="f7-modal-name">Joueur</div>
      <button class="f7-modal-close" onclick="fermerModal()">✕</button>
    </div>

    <div class="f7-modal-total" id="f7-modal-total">0</div>
    <div class="f7-modal-total-lbl">points cette manche</div>

    <div class="f7-modal-section-lbl">Cartes numérotées</div>
    <div class="f7-cards-grid" id="f7-cards-grid"></div>

    <div class="f7-modal-section-lbl">Cartes spéciales</div>

    <div class="f7-special-row">
      <div class="f7-special-btn">
        <span class="sp-icon">➕</span>
        <div class="sp-info">
          <div class="sp-name">Carte +2</div>
          <div class="sp-effect">+2 pts par carte</div>
        </div>
        <div class="f7-counter">
          <button class="f7-counter-btn" onclick="changerPlus2(-1)">−</button>
          <span class="f7-counter-val" id="f7-plus2-val">0</span>
          <button class="f7-counter-btn" onclick="changerPlus2(1)">+</button>
        </div>
      </div>
    </div>

    <div class="f7-modal-section-lbl">Bonus</div>
    <button class="f7-flip7-btn" id="f7-flip7-toggle" onclick="toggleFlip7()">
      <span class="f7-flip7-badge">🃏</span>
      Flip 7 ! &nbsp;<span style="font-size:0.78rem;opacity:0.7;">+15 pts bonus</span>
    </button>

    <div class="f7-modal-btns">
      <button class="f7-btn-cancel" onclick="fermerModal()">Annuler</button>
      <button class="f7-btn-confirm" id="f7-btn-confirm" onclick="confirmerModal()">Confirmer</button>
    </div>
  </div>
</div>

<script>
const COULEURS = ['#a088ff','#ff7070','#50d0a0','#f1c40f','#5fb3ff','#ff9f43'];
let nbJ = 2, joueurs = [], targetScore = 200;

// État du modal
let modalPlayer = -1;
let modalCards = new Set();
let modalPlus2 = 0;
let modalFlip7 = false;

function initSetup() {
  const btns = document.getElementById('f7-nb-btns');
  btns.innerHTML = '';
  [2,3,4,5,6].forEach(n => {
    const b = document.createElement('button');
    b.className = 'nb-btn' + (n === nbJ ? ' active' : '');
    b.textContent = n;
    b.onclick = () => {
      nbJ = n;
      btns.querySelectorAll('.nb-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      renderNoms();
    };
    btns.appendChild(b);
  });
  renderNoms();
}

function renderNoms() {
  const div = document.getElementById('f7-noms');
  const vals = Array.from(div.querySelectorAll('input')).map(i => i.value);
  div.innerHTML = '';
  for (let i = 0; i < nbJ; i++) {
    const row = document.createElement('div');
    row.className = 'name-row';
    const num = document.createElement('div');
    num.className = 'name-num';
    num.style.cssText = `background:${COULEURS[i]}22;color:${COULEURS[i]}`;
    num.textContent = i + 1;
    const inp = document.createElement('input');
    inp.className = 'player-name-input'; inp.type = 'text';
    inp.placeholder = `Joueur ${i+1}`; inp.value = vals[i] || '';
    row.appendChild(num); row.appendChild(inp);
    div.appendChild(row);
  }
}

function demarrer() {
  targetScore = parseInt(document.getElementById('f7-target').value) || 200;
  const inputs = document.querySelectorAll('#f7-noms input');
  joueurs = Array.from(inputs).map((inp, i) => ({
    nom: inp.value.trim() || `Joueur ${i+1}`,
    couleur: COULEURS[i],
    total: 0,
    history: [],
  }));
  document.getElementById('f7-setup').style.display = 'none';
  document.getElementById('f7-game').style.display = '';
  renderTableau();
}

function renderTableau() {
  const table = document.getElementById('f7-table');
  table.innerHTML = '';

  // En-tête
  const thead = document.createElement('thead');
  const trHead = document.createElement('tr');
  joueurs.forEach((j, i) => {
    const th = document.createElement('th');
    th.style.color = j.couleur; th.textContent = j.nom; th.id = `f7-th-${i}`;
    trHead.appendChild(th);
  });
  thead.appendChild(trHead); table.appendChild(thead);
  const tbody = document.createElement('tbody');

  // Totaux
  const trTotal = document.createElement('tr');
  joueurs.forEach((j, i) => {
    const td = document.createElement('td');
    td.className = 'f7-total-cell'; td.id = `f7-total-${i}`; td.textContent = j.total;
    trTotal.appendChild(td);
  });
  tbody.appendChild(trTotal);

  // Barre de progression
  const trBar = document.createElement('tr');
  joueurs.forEach((j, i) => {
    const td = document.createElement('td'); td.className = 'f7-bar-cell';
    const bg = document.createElement('div'); bg.className = 'f7-bar-bg';
    const fill = document.createElement('div'); fill.className = 'f7-bar-fill'; fill.id = `f7-bar-${i}`;
    fill.style.width = Math.min(100, Math.round(j.total / targetScore * 100)) + '%';
    bg.appendChild(fill); td.appendChild(bg); trBar.appendChild(td);
  });
  tbody.appendChild(trBar);

  // Boutons : Undo + Score
  const trAction = document.createElement('tr');
  joueurs.forEach((j, i) => {
    const td = document.createElement('td');
    const cell = document.createElement('div'); cell.className = 'f7-action-cell';
    const undo = document.createElement('button');
    undo.className = 'f7-btn-undo'; undo.id = `f7-undo-${i}`;
    undo.textContent = '↩'; undo.disabled = true;
    undo.onclick = () => annuler(i);
    const score = document.createElement('button');
    score.className = 'f7-btn-score';
    score.innerHTML = '🃏 Entrer<br>les cartes';
    score.onclick = () => ouvrirModal(i);
    cell.appendChild(undo); cell.appendChild(score);
    td.appendChild(cell); trAction.appendChild(td);
  });
  tbody.appendChild(trAction);

  table.appendChild(tbody);
}

// ── Modal ──────────────────────────────────────────────

function ouvrirModal(i) {
  modalPlayer = i;
  modalCards = new Set();
  modalPlus2 = 0;
  modalFlip7 = false;
  const j = joueurs[i];

  // Titre + couleur
  const nameEl = document.getElementById('f7-modal-name');
  nameEl.textContent = j.nom;
  nameEl.style.color = j.couleur;

  // Construire la grille de cartes 0–12
  const grid = document.getElementById('f7-cards-grid');
  grid.innerHTML = '';
  for (let n = 0; n <= 12; n++) {
    const btn = document.createElement('button');
    btn.className = 'f7-card-btn';
    btn.id = `f7-mc-${n}`;
    btn.innerHTML = `<span class="card-num">${n}</span><span class="card-pts">${n} pt${n !== 1 ? 's' : ''}</span>`;
    btn.onclick = () => toggleCarte(n);
    grid.appendChild(btn);
  }

  document.getElementById('f7-plus2-val').textContent = '0';
  document.getElementById('f7-flip7-toggle').classList.remove('active');
  updateModalTotal();
  document.getElementById('f7-overlay').style.display = 'flex';
}

function fermerModal() {
  document.getElementById('f7-overlay').style.display = 'none';
}

function overlayClick(e) {
  if (e.target === document.getElementById('f7-overlay')) fermerModal();
}

function toggleCarte(n) {
  if (modalCards.has(n)) modalCards.delete(n);
  else modalCards.add(n);
  const btn = document.getElementById(`f7-mc-${n}`);
  if (btn) {
    btn.classList.toggle('selected', modalCards.has(n));
    btn.style.borderColor = modalCards.has(n) ? joueurs[modalPlayer].couleur : '';
    btn.style.color = modalCards.has(n) ? joueurs[modalPlayer].couleur : '';
  }
  updateModalTotal();
}

function changerPlus2(delta) {
  modalPlus2 = Math.max(0, modalPlus2 + delta);
  document.getElementById('f7-plus2-val').textContent = modalPlus2;
  updateModalTotal();
}

function toggleFlip7() {
  modalFlip7 = !modalFlip7;
  document.getElementById('f7-flip7-toggle').classList.toggle('active', modalFlip7);
  updateModalTotal();
}

function updateModalTotal() {
  let pts = 0;
  modalCards.forEach(n => pts += n);
  pts += modalPlus2 * 2;
  if (modalFlip7) pts += 15;
  const totalEl = document.getElementById('f7-modal-total');
  totalEl.textContent = pts;
  totalEl.style.color = joueurs[modalPlayer]?.couleur || '#f0ede6';
  document.getElementById('f7-btn-confirm').disabled = pts === 0;
}

function confirmerModal() {
  let pts = 0;
  modalCards.forEach(n => pts += n);
  pts += modalPlus2 * 2;
  if (modalFlip7) pts += 15;
  if (pts === 0) return;
  joueurs[modalPlayer].history.push({
    pts,
    cards: [...modalCards],
    plus2: modalPlus2,
    flip7: modalFlip7,
  });
  joueurs[modalPlayer].total += pts;
  mettreAJour();
  fermerModal();
}

function annuler(i) {
  if (!joueurs[i].history.length) return;
  const e = joueurs[i].history.pop();
  joueurs[i].total = Math.max(0, joueurs[i].total - e.pts);
  mettreAJour();
}

function mettreAJour() {
  const maxScore = Math.max(...joueurs.map(j => j.total));
  const hasWinner = joueurs.some(j => j.total >= targetScore);
  joueurs.forEach((j, i) => {
    const isWinner = j.total >= targetScore;
    const isLeader = !isWinner && j.total > 0 && j.total === maxScore && !hasWinner;
    const cell = document.getElementById(`f7-total-${i}`);
    cell.textContent = j.total;
    cell.classList.toggle('winner', isWinner);
    cell.classList.toggle('leader', isLeader);
    const th = document.getElementById(`f7-th-${i}`);
    th.textContent = j.nom + (isWinner ? ' 🏆' : isLeader ? ' 👑' : '');
    const undo = document.getElementById(`f7-undo-${i}`);
    if (undo) undo.disabled = j.history.length === 0;
    const bar = document.getElementById(`f7-bar-${i}`);
    if (bar) {
      bar.style.width = Math.min(100, Math.round(j.total / targetScore * 100)) + '%';
      bar.classList.toggle('winner', isWinner);
      bar.classList.toggle('leader', isLeader);
    }
  });
}

function reinitialiser() {
  if (!confirm('Commencer une nouvelle partie ?')) return;
  joueurs = [];
  document.getElementById('f7-game').style.display = 'none';
  document.getElementById('f7-setup').style.display = '';
  initSetup();
}

initSetup();
</script>
