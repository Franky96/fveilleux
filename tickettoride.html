<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket to Ride — Score</title>
  <link rel="stylesheet" href="style.css">
  <script>
    const _pT = JSON.parse(sessionStorage.getItem('userPermissions') || '[]');
    if (!sessionStorage.getItem('loggedIn') ||
        (!_pT.includes('jeuxdesociete') && sessionStorage.getItem('userRole') !== 'admin')) {
      window.location.href = 'dashboard.html';
    }
  </script>
  <style>
    body { align-items: flex-start; }
    .ttr { width: 100%; padding-bottom: 2rem; }

    .ttr-topbar {
      position: sticky; top: 0; z-index: 100;
      background: #0f1a0f; border-bottom: 1px solid #2a3a2a;
      padding: 0.6rem 1rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .ttr-topbar a { color: #80cc80; text-decoration: none; font-size: 1.3rem; }
    .ttr-topbar h1 { font-size: 1rem; color: #f0ede6; margin: 0; flex: 1; }

    /* ── Setup ── */
    .ttr-setup { padding: 1.25rem; max-width: 400px; margin: 0 auto; }
    .setup-lbl { font-size: 0.72rem; color: #556655; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .nb-btns { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .nb-btn {
      width: 2.6rem; height: 2.6rem; border-radius: 50%;
      border: 2px solid #2a3a2a; background: transparent;
      color: #556655; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.15s;
    }
    .nb-btn.active { border-color: #c0392b; color: #c0392b; background: rgba(192,57,43,0.1); }
    .name-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
    .name-num {
      width: 1.7rem; height: 1.7rem; border-radius: 50%; flex-shrink: 0;
      font-size: 0.75rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
    }
    .player-name-input {
      flex: 1; padding: 0.6rem 0.75rem;
      background: #0f1a0f; border: 1px solid #2a3a2a; border-radius: 8px;
      color: #f0ede6; font-size: 0.95rem; margin: 0;
    }
    .player-name-input:focus { border-color: #80cc80; outline: none; }
    .btn-start {
      display: block; width: 100%; margin-top: 1.25rem;
      padding: 0.9rem; background: #c0392b; color: #fff;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer;
    }

    /* ── Table ── */
    .score-outer { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .ttr-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .ttr-table th, .ttr-table td { min-width: 120px; }

    .ttr-table thead th {
      padding: 0.85rem 0.5rem;
      font-size: 1.3rem; font-weight: bold; text-align: center;
      background: #0f1a0f; border-bottom: 2px solid #2a3a2a;
    }
    .ttr-table tbody td {
      padding: 0.4rem 0.3rem; text-align: center;
      border-bottom: 1px solid #1a2a1a; background: #0a0f0a;
    }

    /* ── Total ── */
    .ttr-total-cell {
      font-size: 3.5rem; font-weight: bold; color: #f0ede6;
      padding: 0.5rem 0.3rem !important;
    }
    .ttr-total-cell.leader { color: #c0392b; }

    /* ── Route buttons ── */
    .route-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 0.25rem; padding: 0.25rem;
    }
    .btn-route {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0.45rem 0.1rem; min-height: 3rem;
      border-radius: 8px; border: 1px solid #2a3a2a;
      background: #0f1a0f; cursor: pointer; gap: 0.05rem;
      transition: border-color 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-route:active { background: #162816; border-color: #27ae60; }
    .btn-route:disabled { opacity: 0.25; cursor: not-allowed; }
    .btn-route .r-len { font-size: 1.1rem; font-weight: bold; color: #f0ede6; line-height: 1; }
    .btn-route .r-pts { font-size: 0.65rem; color: #80cc80; font-weight: bold; letter-spacing: 0.02em; }
    @keyframes route-flash {
      0%   { background: rgba(39,174,96,0.35); border-color: #27ae60; }
      100% { background: #0f1a0f; border-color: #2a3a2a; }
    }
    .btn-route.flash { animation: route-flash 0.45s ease-out forwards; }

    /* ── Undo + compteur wagons ── */
    .undo-wagon-cell { display: flex; align-items: center; justify-content: center; gap: 0.4rem; }
    .ttr-btn-undo {
      width: 3rem; height: 2.6rem;
      background: transparent; border: 1px solid #3a3a2a;
      border-radius: 10px; color: #556655; font-size: 1.1rem;
      cursor: pointer; margin: 0; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .ttr-btn-undo:not(:disabled):hover { border-color: #c0392b; color: #c0392b; }
    .ttr-btn-undo:disabled { opacity: 0.25; cursor: default; }
    .wagon-badge {
      display: inline-flex; flex-direction: column; align-items: center;
      padding: 0.4rem 1rem;
      border: 1px solid #2a3a2a; border-radius: 8px;
      background: #0f1a0f; line-height: 1.2;
    }
    .wagon-badge .wb-icon { font-size: 1.5rem; }
    .wagon-badge .wb-count { font-size: 2rem; font-weight: bold; color: #a89f94; }
    .wagon-badge.warning { border-color: #f39c12; }
    .wagon-badge.warning .wb-count { color: #f39c12; }
    .wagon-badge.danger  { border-color: #c0392b; }
    .wagon-badge.danger  .wb-count { color: #c0392b; }

    /* ── Section divider ── */
    .ttr-divider td {
      padding: 0.55rem 0.5rem 0.35rem !important;
      background: #050a05 !important;
      font-size: 0.68rem; color: #445544; font-weight: bold;
      letter-spacing: 0.1em; text-transform: uppercase;
      border-top: 2px solid #1a3a1a !important;
      border-bottom: 1px solid #1a3a1a !important;
      cursor: pointer; user-select: none;
    }
    .ttr-divider td:hover { color: #80cc80; }
    .ttr-chevron { display: inline-block; transition: transform 0.2s; margin-right: 0.4rem; }
    .ttr-divider.open .ttr-chevron { transform: rotate(90deg); }

    /* ── Destination Tickets ── */
    .ticket-cell {
      display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
      padding: 0.3rem 0.25rem;
    }
    .ticket-lbl { font-size: 0.62rem; color: #445544; text-transform: uppercase; letter-spacing: 0.08em; }
    .ticket-input {
      width: 5rem; text-align: center;
      padding: 0.5rem 0.2rem;
      background: #0a0f0a; border: 1px solid #2a3a2a;
      border-radius: 8px; color: #f0ede6;
      font-size: 1.05rem; font-weight: bold; margin: 0;
    }
    .ticket-input:focus { border-color: #80cc80; outline: none; }
    .ticket-input::-webkit-inner-spin-button,
    .ticket-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .ticket-input { -moz-appearance: textfield; }
    .ticket-btns { display: flex; gap: 0.3rem; width: 100%; justify-content: center; }
    .btn-ticket-ok {
      flex: 1; padding: 0.45rem 0.1rem;
      border-radius: 8px; border: 1px solid #27ae60;
      background: rgba(39,174,96,0.08); color: #27ae60;
      font-size: 0.8rem; font-weight: bold; cursor: pointer;
    }
    .btn-ticket-fail {
      flex: 1; padding: 0.45rem 0.1rem;
      border-radius: 8px; border: 1px solid #c0392b;
      background: rgba(192,57,43,0.08); color: #c0392b;
      font-size: 0.8rem; font-weight: bold; cursor: pointer;
    }

    /* ── Longest Train ── */
    .ttr-btn-train {
      width: calc(100% - 0.5rem);
      background: rgba(39,174,96,0.08);
      border: 2px solid #27ae60; border-radius: 10px;
      color: #27ae60; font-size: 0.78rem; font-weight: bold;
      padding: 0.65rem 0.3rem; cursor: pointer; margin: 0;
      transition: background 0.15s, color 0.15s;
      line-height: 1.3;
    }
    .ttr-btn-train.active { background: #27ae60; color: #fff; }

    .ttr-table tbody tr:last-child td { border-bottom: none; padding-bottom: 1rem; }
    .btn-new-game {
      display: block; width: calc(100% - 2rem); margin: 0.75rem 1rem 0;
      padding: 0.65rem; background: transparent;
      border: 1px solid #2a3a2a; border-radius: 10px;
      color: #556655; font-size: 0.88rem; cursor: pointer;
    }
  </style>
</head>
<body>
<div class="ttr">

  <div class="ttr-topbar">
    <a href="jeuxdesociete.html">&#8592;</a>
    <h1>🚂 Ticket to Ride — Score</h1>
    <a href="tickettoride-rs.html" style="font-size:0.75rem; background:rgba(52,152,219,0.15); border:1px solid #3498db; color:#fff; border-radius:8px; padding:0.35rem 0.6rem; text-decoration:none; white-space:nowrap;">⛵ Rails &amp; Sails</a>
  </div>

  <div id="ttr-setup" class="ttr-setup">
    <div class="setup-lbl">Nombre de joueurs</div>
    <div class="nb-btns" id="ttr-nb-btns"></div>
    <div class="setup-lbl">Noms des joueurs</div>
    <div id="ttr-noms"></div>
    <div class="setup-lbl" style="margin-top:1.25rem;">Trains par joueur</div>
    <div class="name-row" style="margin-bottom:0;">
      <span style="font-size:1.2rem;">🚂</span>
      <input type="text" inputmode="numeric" id="ttr-max-trains"
        class="player-name-input" style="max-width:5rem; text-align:center;"
        value="45" placeholder="45" />
      <span style="font-size:0.8rem; color:#556655;">wagons au départ</span>
    </div>
    <button class="btn-start" onclick="demarrer()">Commencer ▶</button>
  </div>

  <div id="ttr-game" style="display:none;">
    <div class="score-outer">
      <table class="ttr-table" id="ttr-table"></table>
    </div>
    <button class="btn-new-game" onclick="reinitialiser()">🔄 Nouvelle partie</button>
  </div>

</div>

<script>
const COULEURS = ['#c0392b','#3498db','#27ae60','#f1c40f','#a89f94'];
const ROUTES = [
  { len: 1, pts: 1 },
  { len: 2, pts: 2 },
  { len: 3, pts: 4 },
  { len: 4, pts: 7 },
  { len: 5, pts: 10 },
  { len: 6, pts: 15 },
];

let nbJ = 2, joueurs = [], maxTrains = 45;
let trainOwners = new Set(); // plusieurs joueurs peuvent l'avoir en cas d'égalité

function initSetup() {
  const btns = document.getElementById('ttr-nb-btns');
  btns.innerHTML = '';
  [2,3,4,5].forEach(n => {
    const b = document.createElement('button');
    b.className = 'nb-btn' + (n === nbJ ? ' active' : '');
    b.textContent = n;
    b.onclick = () => {
      nbJ = n;
      btns.querySelectorAll('.nb-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      renderNoms();
    };
    btns.appendChild(b);
  });
  renderNoms();
}

function renderNoms() {
  const div = document.getElementById('ttr-noms');
  const vals = Array.from(div.querySelectorAll('input')).map(i => i.value);
  div.innerHTML = '';
  for (let i = 0; i < nbJ; i++) {
    const row = document.createElement('div');
    row.className = 'name-row';
    const num = document.createElement('div');
    num.className = 'name-num';
    num.style.cssText = `background:${COULEURS[i]}22;color:${COULEURS[i]}`;
    num.textContent = i + 1;
    const inp = document.createElement('input');
    inp.className = 'player-name-input'; inp.type = 'text';
    inp.placeholder = `Joueur ${i+1}`; inp.value = vals[i] || '';
    row.appendChild(num); row.appendChild(inp);
    div.appendChild(row);
  }
}

function demarrer() {
  maxTrains = parseInt(document.getElementById('ttr-max-trains').value) || 45;
  const inputs = document.querySelectorAll('#ttr-noms input');
  joueurs = Array.from(inputs).map((inp, i) => ({
    nom: inp.value.trim() || `Joueur ${i+1}`,
    couleur: COULEURS[i],
    total: 0,
    trains: maxTrains,
    history: [] // { pts, type: 'route'|'ticket'|'train', wagons }
  }));
  trainOwners = new Set();
  document.getElementById('ttr-setup').style.display = 'none';
  document.getElementById('ttr-game').style.display = '';
  renderTableau();
}

function renderTableau() {
  const table = document.getElementById('ttr-table');
  table.innerHTML = '';

  // En-tête
  const thead = document.createElement('thead');
  const trHead = document.createElement('tr');
  joueurs.forEach((j, i) => {
    const th = document.createElement('th');
    th.style.color = j.couleur;
    th.textContent = j.nom;
    th.id = `ttr-th-${i}`;
    trHead.appendChild(th);
  });
  thead.appendChild(trHead);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  // Totaux
  const trTotal = document.createElement('tr');
  joueurs.forEach((j, i) => {
    const td = document.createElement('td');
    td.className = 'ttr-total-cell';
    td.id = `ttr-total-${i}`;
    td.textContent = j.total;
    trTotal.appendChild(td);
  });
  tbody.appendChild(trTotal);

  // Boutons de routes (1–6 wagons)
  const trRoutes = document.createElement('tr');
  joueurs.forEach((j, i) => {
    const td = document.createElement('td');
    const grid = document.createElement('div');
    grid.className = 'route-grid';
    ROUTES.forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'btn-route';
      btn.id = `ttr-route-${i}-${r.len}`;
      btn.innerHTML = `<span class="r-len">${r.len}</span><span class="r-pts">${r.pts} pt</span>`;
      btn.onclick = () => ajouterRoute(i, r.pts, r.len, btn);
      grid.appendChild(btn);
    });
    td.appendChild(grid);
    trRoutes.appendChild(td);
  });
  tbody.appendChild(trRoutes);

  // Undo + compteur wagons
  const trUndo = document.createElement('tr');
  joueurs.forEach((j, i) => {
    const td = document.createElement('td');
    const cell = document.createElement('div');
    cell.className = 'undo-wagon-cell';
    const undo = document.createElement('button');
    undo.className = 'ttr-btn-undo'; undo.id = `ttr-btn-undo-${i}`;
    undo.textContent = '↩'; undo.disabled = true;
    undo.onclick = () => annuler(i);
    const badge = document.createElement('div');
    badge.className = 'wagon-badge'; badge.id = `ttr-wagons-${i}`;
    badge.innerHTML = `<span class="wb-icon">🚂</span><span class="wb-count" id="ttr-wcount-${i}">${j.trains}</span>`;
    cell.appendChild(undo); cell.appendChild(badge);
    td.appendChild(cell);
    trUndo.appendChild(td);
  });
  tbody.appendChild(trUndo);

  // Séparateur Fin de partie (collapsible)
  const trDiv = document.createElement('tr');
  trDiv.className = 'ttr-divider';
  trDiv.id = 'ttr-divider';
  const tdDiv = document.createElement('td');
  tdDiv.colSpan = joueurs.length;
  tdDiv.innerHTML = '<span class="ttr-chevron">▶</span>🏁 Fin de partie — Destination Tickets';
  tdDiv.onclick = () => {
    const open = trDiv.classList.toggle('open');
    document.getElementById('ttr-tr-tickets').style.display = open ? '' : 'none';
    document.getElementById('ttr-tr-train').style.display   = open ? '' : 'none';
  };
  trDiv.appendChild(tdDiv);
  tbody.appendChild(trDiv);

  // Destination Tickets
  const trTickets = document.createElement('tr');
  trTickets.id = 'ttr-tr-tickets';
  trTickets.style.display = 'none';
  joueurs.forEach((j, i) => {
    const td = document.createElement('td');
    const cell = document.createElement('div');
    cell.className = 'ticket-cell';
    const lbl = document.createElement('div');
    lbl.className = 'ticket-lbl'; lbl.textContent = 'valeur du ticket';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.inputMode = 'numeric';
    inp.className = 'ticket-input'; inp.id = `ttr-ticket-${i}`;
    inp.placeholder = 'pts';
    const btns = document.createElement('div');
    btns.className = 'ticket-btns';
    const btnOk = document.createElement('button');
    btnOk.className = 'btn-ticket-ok'; btnOk.textContent = '✓ Réussi';
    btnOk.onclick = () => ajouterTicket(i, 1);
    const btnFail = document.createElement('button');
    btnFail.className = 'btn-ticket-fail'; btnFail.textContent = '✗ Raté';
    btnFail.onclick = () => ajouterTicket(i, -1);
    btns.appendChild(btnOk); btns.appendChild(btnFail);
    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:0.6rem;color:#445544;text-align:center;line-height:1.4;';
    hint.textContent = 'Entrer la valeur du ticket puis ✓ pour ajouter ou ✗ pour soustraire';
    cell.appendChild(lbl); cell.appendChild(inp); cell.appendChild(btns); cell.appendChild(hint);
    td.appendChild(cell);
    trTickets.appendChild(td);
  });
  tbody.appendChild(trTickets);

  // Longest Train (plusieurs joueurs possibles en cas d'égalité)
  const trTrain = document.createElement('tr');
  trTrain.id = 'ttr-tr-train';
  trTrain.style.display = 'none';
  joueurs.forEach((j, i) => {
    const td = document.createElement('td');
    const btn = document.createElement('button');
    btn.className = 'ttr-btn-train' + (trainOwners.has(i) ? ' active' : '');
    btn.id = `ttr-btn-train-${i}`;
    btn.innerHTML = '🚂 Chemin le plus long<br>+10 pts';
    btn.onclick = () => toggleTrain(i);
    td.appendChild(btn);
    trTrain.appendChild(td);
  });
  tbody.appendChild(trTrain);

  table.appendChild(tbody);
}

function ajouterRoute(i, pts, wagons, btn) {
  joueurs[i].history.push({ pts, type: 'route', wagons });
  joueurs[i].total += pts;
  joueurs[i].trains = Math.max(0, joueurs[i].trains - wagons);
  btn.classList.remove('flash');
  void btn.offsetWidth;
  btn.classList.add('flash');
  mettreAJour();
}

function ajouterTicket(i, sign) {
  const inp = document.getElementById(`ttr-ticket-${i}`);
  const val = parseInt(inp.value) || 0;
  if (val <= 0) return;
  const pts = sign * val;
  joueurs[i].history.push({ pts, type: 'ticket' });
  joueurs[i].total += pts;
  inp.value = '';
  mettreAJour();
}

function toggleTrain(i) {
  if (trainOwners.has(i)) {
    trainOwners.delete(i);
    joueurs[i].history.push({ pts: -10, type: 'train' });
    joueurs[i].total -= 10;
  } else {
    trainOwners.add(i);
    joueurs[i].history.push({ pts: 10, type: 'train' });
    joueurs[i].total += 10;
  }
  mettreAJour();
}

function annuler(i) {
  if (!joueurs[i].history.length) return;
  const entry = joueurs[i].history.pop();
  joueurs[i].total -= entry.pts;
  if (entry.wagons) joueurs[i].trains = Math.min(maxTrains, joueurs[i].trains + entry.wagons);
  if (entry.type === 'train') {
    if (entry.pts === 10)  trainOwners.delete(i);
    if (entry.pts === -10) trainOwners.add(i);
  }
  mettreAJour();
}

function mettreAJour() {
  const maxScore = Math.max(...joueurs.map(j => j.total));
  joueurs.forEach((j, i) => {
    const cell = document.getElementById(`ttr-total-${i}`);
    const isLeader = j.total > 0 && j.total === maxScore;
    cell.textContent = j.total;
    cell.classList.toggle('leader', isLeader);
    const th = document.getElementById(`ttr-th-${i}`);
    th.textContent = j.nom + (isLeader ? ' 🏆' : '');
    const undo = document.getElementById(`ttr-btn-undo-${i}`);
    if (undo) undo.disabled = j.history.length === 0;
    const train = document.getElementById(`ttr-btn-train-${i}`);
    if (train) train.classList.toggle('active', trainOwners.has(i));
    const badge = document.getElementById(`ttr-wagons-${i}`);
    const wcount = document.getElementById(`ttr-wcount-${i}`);
    if (badge && wcount) {
      wcount.textContent = j.trains;
      badge.classList.toggle('danger',  j.trains <= 2);
      badge.classList.toggle('warning', j.trains > 2 && j.trains <= 5);
    }
    ROUTES.forEach(r => {
      const btn = document.getElementById(`ttr-route-${i}-${r.len}`);
      if (btn) btn.disabled = j.trains < r.len;
    });
  });
}

function reinitialiser() {
  if (!confirm('Commencer une nouvelle partie ?')) return;
  joueurs = [];
  trainOwners = new Set();
  document.getElementById('ttr-game').style.display = 'none';
  document.getElementById('ttr-setup').style.display = '';
  initSetup();
}

initSetup();
</script>

<div data-version-badge style="position:fixed;bottom:1rem;left:1rem;background:red;color:white;font-weight:bold;font-size:0.8rem;padding:0.3rem 0.6rem;border-radius:5px;z-index:9999;"></div>
<script src="version.js"></script>
</body>
</html>
