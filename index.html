<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outils de Frank — Connexion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <h1>Outils de Frank</h1>
    <p class="subtitle">Espace privé</p>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Nom d'utilisateur" required />
      <input type="password" id="password" placeholder="Mot de passe" required />
      <button type="submit">Se connecter</button>
      <p id="error-msg"></p>
    </form>

    <button id="guest-btn" type="button" style="display:block; width:100%; margin-top:0.5rem; padding:0.65rem; background:transparent; border:1px solid #2a3a2a; border-radius:8px; color:#556655; font-size:0.9rem; cursor:pointer; transition:all 0.2s;">
      👤 Continuer en tant qu'invité
    </button>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
